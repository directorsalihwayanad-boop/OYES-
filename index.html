<!-- Folder Manager Section inside Admin Panel -->
<div class="card-3d p-4 rounded-2xl space-y-3 border border-amber-500/50">
    <h4 class="text-xs font-bold text-amber-300">📂 Folder Manager & Directory</h4>
    
    <div class="space-y-2">
        <input type="text" id="newFolderNameInput" placeholder="New Folder Name" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-amber-500">
        <input type="text" id="newFolderSloganInput" placeholder="Folder Slogan / Description" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-amber-500">
        
        <button onclick="addNewFolder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs shadow">➕ Create New Folder</button>
    </div>

    <div class="mt-4 pt-3 border-t border-slate-800">
        <h5 class="text-[11px] font-bold text-amber-300 mb-2">Existing Folders List:</h5>
        <div id="adminFoldersList" class="space-y-2 max-h-48 overflow-y-auto pr-1 text-xs"></div>
    </div>
</div>
