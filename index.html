<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES GLOBAL HUB - Final Clean Studio Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Cinzel:wght@600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--app-text-color, #f8fafc);
            font-family: var(--app-font, 'Poppins'), sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.96));
            backdrop-filter: blur(18px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 12px 35px -10px rgba(245, 158, 11, 0.25);
            background-size: cover;
            background-position: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px -10px rgba(245, 158, 11, 0.4);
        }
        .dynamic-title {
            color: var(--app-title-color, #fbbf24) !important;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20" id="mainBody">

    <!-- Top Header -->
    <header class="p-3 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="flex justify-between items-center max-w-md mx-auto px-1">
            <button class="text-amber-400 text-xl font-bold p-1 hover:scale-110 transition">☰</button>
            <div class="flex items-center gap-1.5 cursor-pointer" onclick="goHome()">
                <div id="appLogoDisplay" class="w-9 h-9 rounded-full bg-amber-950 border border-amber-500/50 flex items-center justify-center text-xs overflow-hidden shadow">
                    <span>🌐</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <select class="bg-slate-900 text-amber-300 border border-amber-500/50 text-[10px] rounded-lg px-2 py-1 outline-none">
                    <option value="en">English ▾</option>
                    <option value="ml">മലയാളം</option>
                </select>
                <button onclick="requestAdminAccess()" class="bg-amber-950/80 text-amber-300 text-[10px] font-semibold border border-amber-500/60 rounded-lg px-2.5 py-1 shadow hover:bg-amber-900 transition">⚙️ Admin</button>
            </div>
        </div>
    </header>

    <!-- Master Admin Control Panel -->
    <div id="adminPanelBox" class="max-w-md mx-auto w-full bg-slate-900/98 border-b border-amber-500/60 p-4 hidden space-y-3 z-40 shadow-2xl">
        <div class="flex justify-between items-center">
            <h3 class="text-amber-400 font-bold text-xs uppercase tracking-wider flex items-center gap-1">🔒 Full Admin & Studio</h3>
            <button onclick="lockAdminPanel()" class="text-xs bg-red-900/80 hover:bg-red-800 text-white px-2.5 py-1 rounded font-bold shadow">Lock 🔒</button>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
            <button onclick="document.getElementById('logoFileInput').click()" class="bg-amber-600/90 hover:bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl text-[10px] shadow transition">🖼️ Change App Logo</button>
            <button onclick="document.getElementById('bgFileInput').click()" class="bg-amber-600/90 hover:bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl text-[10px] shadow transition">🌅 Change App BG</button>
            <button onclick="document.getElementById('topBannerBgInput').click()" class="bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl text-[10px] shadow col-span-2 transition">🌄 Change Top Box BG</button>
            <button onclick="editTopBannerPrompt()" class="bg-indigo-600/90 hover:bg-indigo-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow col-span-2 transition">✏️ Edit Top Banner Text</button>
            
            <!-- Design Studio Options -->
            <button onclick="openColorStudio()" class="bg-pink-600/90 hover:bg-pink-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">🎨 Change Title Color</button>
            <button onclick="openFontStudio()" class="bg-purple-600/90 hover:bg-purple-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">🔤 Change Font Style</button>

            <button onclick="promptFolderCustomization('bg')" class="bg-blue-600/90 hover:bg-blue-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">📁 Folder Background</button>
            <button onclick="promptFolderCustomization('icon')" class="bg-blue-600/90 hover:bg-blue-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">🔖 Folder Icon Photo</button>
            <button onclick="addNewMainFolderPrompt()" class="bg-emerald-600/90 hover:bg-emerald-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">➕ Add New Folder</button>
            <button onclick="editFolderDetailsPrompt()" class="bg-violet-600/90 hover:bg-violet-500 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">✏️ Edit Folder Name</button>
            <button onclick="deleteFolderPrompt()" class="bg-rose-900/90 hover:bg-rose-800 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">🗑️ Delete Folder</button>
            <button onclick="checkStorageStatus()" class="bg-cyan-700/90 hover:bg-cyan-600 text-white font-bold p-2.5 rounded-xl text-[10px] shadow transition">📊 Check Storage</button>
            <button onclick="resetAppSettings()" class="bg-red-950 hover:bg-red-900 text-white font-bold p-2.5 rounded-xl text-[10px] shadow col-span-2 transition">🔄 Factory Reset Settings</button>
        </div>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="logoFileInput" class="hidden" onchange="applyGlobalLogo(event)">
    <input type="file" id="bgFileInput" class="hidden" onchange="applyGlobalBackground(event)">
    <input type="file" id="topBannerBgInput" class="hidden" onchange="applyTopBannerBg(event)">
    <input type="file" id="folderBgInput" class="hidden" onchange="applyFolderBgFile(event)">
    <input type="file" id="folderIconInput" class="hidden" onchange="applyFolderIconFile(event)">
    <input type="file" id="itemMediaInput" class="hidden" onchange="processItemMediaUpload(event)">

    <!-- Main Dashboard View -->
    <main id="homeView" class="flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <!-- Editable Top Banner Box (Without Eagle/Bird Icon) -->
        <div id="topBannerBox" class="bg-slate-900/95 border border-amber-500/40 p-4 rounded-3xl shadow-xl text-center space-y-3 bg-cover bg-center">
            <div class="space-y-1 pt-1">
                <h2 id="bannerTitle1" class="text-lg font-black tracking-widest dynamic-title">CONNECTING PEOPLE</h2>
                <h2 id="bannerTitle2" class="text-lg font-black tracking-widest dynamic-title">UNITING OPPORTUNITIES</h2>
                <p id="bannerSubtitle" class="text-[10px] text-amber-200 font-semibold tracking-wider mt-1">OYES — A WORLD OF OPPORTUNITIES</p>
            </div>
            <div class="relative mt-2">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-amber-400 text-xs">🔍</span>
                <input type="text" placeholder="Search anything on OYES..." class="w-full bg-slate-950/80 border border-amber-500/30 rounded-2xl py-2 pl-9 pr-9 text-[11px] text-slate-200 focus:outline-none focus:border-amber-400">
            </div>
        </div>

        <!-- Main Folders Grid Container -->
        <div class="grid grid-cols-2 gap-3" id="mainHomeGrid"></div>
    </main>

    <!-- Sub-folder Grid View -->
    <main id="subFolderView" class="max-w-md mx-auto p-4 w-full space-y-3 hidden flex-grow">
        <div class="flex justify-between items-center mb-2">
            <button onclick="goHome()" class="bg-amber-500/20 border border-amber-500/50 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-amber-500/30 transition">⬅️ Back to Home</button>
            <button id="addItemBtn" onclick="openAddItemPrompt()" class="bg-emerald-600/90 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow hidden transition">➕ Upload Photo / PDF</button>
        </div>
        <div id="subFolderContainer" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Bottom Navigation Footer -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-950/90 backdrop-blur-xl border-t border-amber-500/20 py-2.5 px-4 flex justify-around items-center z-50">
        <button onclick="goHome()" class="flex flex-col items-center text-amber-400 text-[10px] font-bold"><span class="text-lg">🏠</span>Home</button>
        <button onclick="openDomain(1)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium transition"><span class="text-lg">📖</span>Books</button>
        <button onclick="openDomain(2)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium transition"><span class="text-lg">💼</span>Jobs</button>
        <button onclick="openDomain(7)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium transition"><span class="text-lg">🎬</span>Cinema</button>
        <button onclick="openDomain(5)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium transition"><span class="text-lg">👥</span>Entertainment</button>
    </nav>

    <!-- JavaScript Engine -->

        let isAdminLoggedIn = false;
        let targetFolderIdForCustom = null;
        let pendingItemData = null;

            { id: 2, name: "JOB VACANCIES & CLEANING", desc: "Shift in thought Progress in life", icon: "💼", bg: "" },
            { id: 3, name: "ULTIMATE HOME CONSTRUCTION SOLUTION", desc: "Marbles, Granites, Kota, Vettukallu, Appliances & Workers", icon: "🏠", bg: "" },
            { id: 4, name: "STAYS & HOTELS", desc: "One connection Endless possibilities", icon: "🏨", bg: "" },
            { id: 5, name: "BUY & SELL MARKET HUB", desc: "Your world Your community", icon: "🤝", bg: "" },

            { id: 7, name: "OYES CINEMA & STUDIO", desc: "Watch • Upload • Sell • Earn", icon: "🎥", bg: "", fullWidth: true }
        ];

                {name: "Water Tank Cleaning", icon: "🚿", price: "₹799", desc: "Sump and overhead tank cleaning.", link: "https://wa.me/919947198248?text=Tank", type: "link"},
                {name: "Job Vacancies", icon: "📋", price: "Updates", desc: "Local & government job portals.", link: "https://keralapsc.gov.in", type: "link"}

            ]
        };

        function getMainFolders() {
            const saved = localStorage.getItem('oyesMainFolders');
            if (saved) {
                let folders = JSON.parse(saved);
                defaultMainFolders.forEach(def => {
                    if (!folders.some(f => f.id === def.id)) {
                        folders.push(def);
                    }
                });
                return folders;
            }
            return defaultMainFolders;
        }

        function saveMainFolders(folders) {
            localStorage.setItem('oyesMainFolders', JSON.stringify(folders));
        }

        function getDomainData() {
            const saved = localStorage.getItem('oyesDomainData');
            return saved ? JSON.parse(saved) : defaultDomainData;
        }

        function saveDomainData(data) {
            localStorage.setItem('oyesDomainData', JSON.stringify(data));
        }

        function loadDesignStudioPreferences() {
            const titleColor = localStorage.getItem('appTitleColor') || '#fbbf24';
            const fontStyle = localStorage.getItem('appFontFamily') || "'Poppins', sans-serif";

            document.documentElement.style.setProperty('--app-title-color', titleColor);
            document.documentElement.style.setProperty('--app-font', fontStyle);
        }

        function openColorStudio() {
            let tColor = prompt("Enter Title Color (Hex code e.g. #fbbf24, #38bdf8, #f43f5e, #ffffff):", localStorage.getItem('appTitleColor') || '#fbbf24');
            if (tColor) {
                localStorage.setItem('appTitleColor', tColor);
                loadDesignStudioPreferences();
                renderHome();
                alert("ടൈറ്റിൽ കളർ മാറ്റി!");
            }
        }

        function openFontStudio() {
            let choice = prompt("Select Font Style Number:\n1. Poppins (Modern)\n2. Cinzel (Classic / Royal)\n3. Orbitron (Futuristic)", "1");
            let selectedFont = "'Poppins', sans-serif";

            if (choice === "2") selectedFont = "'Cinzel', serif";
            else if (choice === "3") selectedFont = "'Orbitron', sans-serif";

            localStorage.setItem('appFontFamily', selectedFont);
            loadDesignStudioPreferences();
            renderHome();
            alert("ഫോണ്ട് സ്റ്റൈൽ അപ്ഡേറ്റ് ചെയ്തു!");
        }

        function loadTopBanner() {
            loadDesignStudio
