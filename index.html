<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES - One World Many Opportunities</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
        }
        /* ബിസിനസ്സ് ലോഗിൻ ബട്ടൺ മുകളിൽ ഒരു സൈഡിൽ നൽകാൻ */
        .business-login-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #238636;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .business-login-btn:hover {
            background-color: #2ea043;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .logo-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            color: #ffcc00;
        }
        p {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 30px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .menu-btn {
            background-color: #1f6feb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        .menu-btn:hover {
            background-color: #388bfd;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ഷോപ്പ് ഉടമകൾക്കും ബിസിനസുകാർക്കുമുള്ള ലോഗിൻ ബട്ടൺ -->
    <a href="#" class="business-login-btn">ബിസിനസ്സ് ലോഗിൻ</a>

    <div class="container">
        <!-- പരുന്തിന്റെ ഒറിജിനൽ ലോഗോ -->
        <img src="watermarked_img_350157874029767559.png" alt="OYES Logo" class="logo-img">[span_1](start_span)[span_1](end_span)
        
        <h1>OYES</h1>
        <p>ONE WORLD • MANY OPPORTUNITIES</p>

        <div class="menu">
            <a href="#" class="menu-btn">ഹോം (Home)</a>
            <a href="#" class="menu-btn">പ്രൊജക്റ്റുകൾ (Projects)</a>
            <a href="#" class="menu-btn">ഓഡിഷൻ / കാസ്റ്റിംഗ് (Casting)</a>
            <a href="#" class="menu-btn">ബന്ധപ്പെടാൻ (Contact)</a>
        </div>
    </div>

</body>
</html>
