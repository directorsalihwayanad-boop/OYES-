<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="appTitleTag">OYES APP - A World at Your Fingertips</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Orbitron:wght@500;700;900&family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 30px -10px rgba(14, 165, 233, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-3d:hover {
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 15px 35px -5px rgba(6, 182, 212, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }
        .card-all {
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.4), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(45, 212, 191, 0.5);
            box-shadow: 0 12px 30px -10px rgba(45, 212, 191, 0.4);
        }
    </style>
</head>
<body id="appBody" class="flex flex-col justify-between">

    <!-- Header Section -->
    <header class="p-3 text-center bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-50 shadow-lg">
        <div class="flex justify-between items-center max-w-md mx-auto px-1 mb-1">
            <div class="flex items-center gap-1.5">
                <div id="adminTriggerBtn" class="cursor-pointer flex items-center gap-1.5 select-none" title="Double Tap for Admin Settings">
                    <div id="headerLogoContainer" class="text-xl flex items-center justify-center">
                        <span id="headerLogoIcon">🌟</span>
                    </div>
                    <h1 id="headerMainTitle" class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-fuchsia-500">
                        OYES APP
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="requestAdminAccess()" class="bg-cyan-950 text-cyan-300 text-xs font-bold border border-cyan-500 rounded-xl px-2.5 py-1.5 shadow hover:bg-cyan-900 transition-all flex items-center gap-1">
                    ⚙️ <span class="text-[10px]">Settings</span>
                </button>
                <select id="langSelector" onchange="changeAppLanguage(this.value)" class="bg-slate-900 text-cyan-300 text-[11px] font-bold border border-cyan-500/50 rounded-xl px-2 py-1.5 focus:outline-none">
                    <option value="en">EN</option>
                    <option value="ml">മലയാളം</option>
                    <option value="ta">தமிழ்</option>
                    <option value="kn">ಕನ್ನಡ</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </div>
        </div>
        <p id="headerSubTitle" class="text-[10px] text-cyan-300/80 font-medium tracking-wide mt-0.5">"A World at Your Fingertips — The Digital Companion of Trust & Development!"</p>
    </header>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-cyan-500/60 p-5 rounded-3xl max-w-xs w-full shadow-2xl space-y-3">
            <h3 class="text-sm font-bold text-cyan-300 text-center">🔐 Director Admin Login</h3>
            <p class="text-[11px] text-slate-300 text-center">Enter Director Secret Code:</p>
            <input type="password" id="adminSecretInput" placeholder="Enter code..." class="w-full bg-slate-950 text-slate-200 px-3 py-2 rounded-xl border border-cyan-600/50 text-xs focus:outline-none focus:border-cyan-400 text-center">
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="closeAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-xl font-bold">Cancel</button>
                <button onclick="verifyAdminCode()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs py-2 rounded-xl font-bold">Login</button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard View -->
    <main id="homeView" class="flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        
        <div class="flex justify-between items-center px-1">
            <span id="userCategoryBadge" class="text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-700/60 px-2.5 py-1 rounded-full font-bold">User: Direct Access</span>
            <button onclick="openHomeAIChat()" class="bg-gradient-to-r from-cyan-950/90 to-indigo-950/90 border border-cyan-500/50 hover:border-cyan-400 px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-md transition-all">
                <span class="text-sm">🤖✨</span>
                <span id="aiBtnText" class="text-[11px] font-bold text-cyan-300">OYES Google AI Assistant</span>
            </button>
        </div>

        <div class="relative flex items-center">
            <input type="text" id="searchBox" placeholder="Search or speak here..." class="w-full bg-slate-900/80 text-slate-200 placeholder-slate-400 px-4 py-3 pr-12 rounded-2xl border border-slate-700/80 focus:outline-none focus:border-cyan-400 text-sm shadow-inner">
            <button onclick="triggerVoiceAssistant()" class="absolute right-3 bg-cyan-600/30 hover:bg-cyan-600/50 border border-cyan-500/50 text-cyan-300 p-2 rounded-xl text-sm transition-all animate-pulse">🎤</button>
        </div>

        <div class="flex justify-between items-center px-1">
            <h2 id="homeSectionTitle" class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Home Main Folders
            </h2>
            <span id="voiceStatus" class="text-[10px] text-emerald-300 bg-emerald-950/60 border border-emerald-800/50 px-2.5 py-0.5 rounded-full font-semibold">Active Session</span>
        </div>

        <!-- Folder Grid Container -->
        <div id="folderGrid" class="grid grid-cols-2 gap-3.5">
            <div onclick="openSubFolders('Education', [
                {name: 'Quran Online Reading (Free)', url: 'https://quran.com/'},
                {name
