<!DOCTYPE html>

    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);

            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
            transition: all 0.3s ease;
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>

    <!-- Global Hidden File Manager Trigger -->
    <input type="file" id="globalFileManager" class="hidden" multiple accept="image/*,video/*,.pdf" onchange="handleFileManagedUpload(event)">

    <!-- Admin Login Modal (Secret Code: salih9947) -->

                {name: "Construction Workers & Masons", icon: "👷", desc: "Expert stone masons, tile fixers, concrete workers, plumbers & electricians.", link: "https://wa.me/919947198248?text=Workers%20Labours%20Inquiry"}

                {name: "Wayanad Stays", icon: "⛰️", desc: "Resorts and homestays in Wayanad.", link: "https://www.booking.com"},

                {name: "Kochi Stays", icon: "🏙️", desc: "Hotels in Ernakulam / Kochi.", link: "https://www.booking.com"}
            ],
            5: [
                {name: "Cows & Goats (Live Stock)", icon: "🐄", desc: "Buy and sell pets & farm animals.", link: "https://wa.me/919947198248?text=LiveStock%20Inquiry"},
                {name: "Real Estate Hub", icon: "🏡", desc: "Houses, plots and lands for sale.", link: "https://wa.me/919947198248?text=RealEstate%20Inquiry"},
                {name: "Vehicles Market", icon: "🚗", desc: "Cars and bikes buy/sell portal.", link: "https://wa.me/919947198248?text=Vehicle%20Inquiry"}
            ],

        let domainFoldersData = JSON.parse(localStorage.getItem('oyes_domains')) || defaultDomainData;

        function renderHomeGrid() {
            let container = document.getElementById('homeGridContainer');
            let html = "";
            rootFolders.forEach((folder, idx) => {
                let isFullSpan = (idx === 6) ? "col-span-2 max-w-[200px] mx-auto w-full" : "";
                html += `
                    <div onclick="openDomainFolders(${folder.id})" class="card-3d p-3.5 rounded-2xl cursor-pointer flex flex-col justify-between border border-amber-500/40 text-center ${isFullSpan}">
                        <div class="space-y-1.5 mt-1">
                            <span class="text-3xl block">${folder.icon}</span>
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${folder.name}</h3>
                            <p class="text-[9px] text-slate-300">${folder.slogan}</p>
                        </div>
                        <div class="flex gap-1 mt-3">
                            <span class="bg-amber-600/80 hover:bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-xl flex-1 text-[10px] shadow">Open ➔</span>
                            <span onclick="event.stopPropagation(); openVoiceAI('${folder.name}')" class="bg-emerald-600/80 text-white font-bold px-2 py-1 rounded-xl text-[10px] shadow" title="Voice & AI Assistant">🎙️ AI</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            let savedLang = localStorage.getItem('oyes_lang') || 'en';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
            renderHomeGrid();
            loadPersistentCustomizations();
        });

        function loadPersistentCustomizations() {
            let savedLogo = localStorage.getItem('oyes_custom_logo');
            if (savedLogo) {
                document.getElementById('headerLogoContainer').innerHTML = `<img src="${savedLogo}" class="w-full h-full object-cover rounded-full">`;
                document.getElementById('bannerLogoContainer').innerHTML = `<img src="${savedLogo}" class="w-full h-full object-cover rounded-full">`;
            }
            let savedBg = localStorage.getItem('oyes_custom_bg');
            if (savedBg) {
                document.getElementById('appBody').style.backgroundImage = `url('${savedBg}')`;
            }
        }

        // File Manager Hub Trigger
        let activeFileManagerAction = null;
        let activeTargetDomainId = null;

        function openFileManager(actionType = 'general', domainId = null) {
            activeFileManagerAction = actionType;
            activeTargetDomainId = domainId;
            document.getElementById('globalFileManager').click();
        }

        function handleFileManagedUpload(event) {
            let files = event.target.files;
            if (files.length > 0) {
                let file = files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    let fileDataUrl = e.target.result;
                    if (activeFileManagerAction === 'logo') {
                        localStorage.setItem('oyes_custom_logo', fileDataUrl);
                        loadPersistentCustomizations();
                        alert("App Logo updated permanently via File Manager!");
                    } else if (activeFileManagerAction === 'background') {
                        localStorage.setItem('oyes_custom_bg', fileDataUrl);
                        loadPersistentCustomizations();
                        alert("App Background updated permanently via File Manager!");
                    } else {
                        alert("Files successfully uploaded and saved in OYES File Manager Hub!");
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // Voice & Text Enabled AI Assistant (Speech Recognition)
        function openVoiceAI(domainName) {
            let userQuery = "";
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ml-IN'; // Default support for Malayalam, adjusts dynamically
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = function() {
                    alert(`🎙️ OYES Voice AI Listening (${domainName})... Speak now!`);
                };

                recognition.onresult = function(event) {
                    userQuery = event.results[0][0].transcript;
                    alert(`AI Response for "${domainName}" (Voice: "${userQuery}"): Processed successfully with multi-language support!`);
                };

                recognition.onerror = function(event) {
                    // Fallback to text prompt if microphone is blocked or not available
                    userQuery = prompt(`🤖 OYES AI Assistant (${domainName}): Type your question here:`);
                    if (userQuery) {
                        alert(`AI Response for "${domainName}": "${userQuery}" - Processed successfully!`);
                    }
                };

                recognition.start();
            } else {
                userQuery = prompt(`🤖 OYES AI Assistant (${domainName}): Type your question here:`);
                if (userQuery) {
                    alert(`AI Response for "${domainName}": "${userQuery}" - Processed successfully!`);
                }
            }
        }

        // Admin Security & Panel
        function requestAdminAccess() {
            document.getElementById('adminSecretInput').value = "";
            document.getElementById('adminLoginModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminLoginModal').classList.add('hidden');
        }

        function verifyAdminCode() {
            let code = document.getElementById('adminSecretInput').value.trim();
            if (code === "salih9947") {
                closeAdminModal();
                alert("Admin Access Verified Successfully!");
                openAdminSettings();
            } else {
                alert("Incorrect Security Code!");
            }
        }

                        <div class="flex gap-2 items-center">
                            <input type="text" id="root_icon_${idx}" value="${folder.icon}" class="w-10 bg-slate-900 text-center text-amber-300 p-1.5 rounded border border-slate-700 text-xs">
                            <input type="text" id="root_name_${idx}" value="${folder.name}" class="flex-grow bg-slate-900 text-slate-200 p-1.5 rounded border border-slate-700 text-xs font-bold">
                        </div>

                    let item = items[idx];
                    editHtml += `
                        <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-700 flex gap-2 items-center text-[11px]">
                            <input type="text" id="sub_icon_${dId}_${idx}" value="${item.icon}" class="w-8 bg-slate-900 text-center p-1 rounded border border-slate-700 text-xs">
                            <input type="text" id="sub_name_${dId}_${idx}" value="${item.name}" class="flex-grow bg-slate-900 text-slate-200 p-1 rounded border border-slate-700 text-[10px]">
                            <button type="button" onclick="updateSubItemName(${dId}, ${idx})" class="bg-emerald-700 text-white px-2 py-1 rounded text-[10px]">Save</button>
                            <button type="button" onclick="deleteSubItem(${dId}, ${idx})" class="bg-rose-700 text-white px-2 py-1 rounded text-[10px]">Delete</button>
                        </div>
                    `;
                }
                editHtml += `
                    <div class="mt-2 pt-2 border-t border-slate-800 flex gap-1">
                        <input type="text" id="new_sub_name_${dId}" placeholder="New sub-folder name..." class="flex-grow bg-slate-900 text-slate-200 p-1 rounded border border-slate-700 text-[10px]">
                        <button type="button" onclick="addNewSubItem(${dId})" class="bg-blue-600 text-white px-3 py-1 rounded text-[10px] font-bold">+ Add Sub-Folder</button>
                    </div>
                </div>`;
            }

            grid.innerHTML = editHtml;
        }

        function updateRootFolder(index) {
            let newIcon = document.getElementById(`root_icon_${index}`).value.trim();
            let newName = document.getElementById(`root_name_${index}`).value.trim();
            let newSlogan = document.getElementById(`root_slogan_${index}`).value.trim();
            if (newName) {
                rootFolders[index].icon = newIcon || "📁";
                rootFolders[index].name = newName;
                rootFolders[index].slogan = newSlogan;
                localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
                renderHomeGrid();
                alert("Root folder updated permanently!");
                openAdminSettings();
            }
        }

        function updateSubItemName(domainId, index) {
            let newName = document.getElementById(`sub_name_${domainId}_${index}`).value.trim();
            let newIcon = document.getElementById(`sub_icon_${domainId}_${index}`).value.trim();
            if (newName) {
                domainFoldersData[domainId][index].name = newName;
                domainFoldersData[domainId][index].icon = newIcon || "📁";
                localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                alert("Sub-item updated successfully!");
                openAdminSettings();
            }
        }

        function deleteSubItem(domainId, index) {
            if (confirm("Are you sure you want to delete this sub-folder?")) {
                domainFoldersData[domainId].splice(index, 1);
                localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                alert("Deleted successfully!");
                openAdminSettings();
            }
        }

        function addNewSubItem(domainId) {
            let inputField = document.getElementById(`new_sub_name_${domainId}`);
            let name = inputField.value.trim();
            if (name) {
                if (!domainFoldersData[domainId]) domainFoldersData[domainId] = [];
                domainFoldersData[domainId].push({
                    name: name,
                    icon: "📁",
                    desc: "Custom created sub-folder item.",
                    link: "https://wa.me/919947198248?text=" + encodeURIComponent(name + " Inquiry")
                });
                localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                inputField.value = "";
                alert("New sub-folder created successfully!");
                openAdminSettings();
            }
        }

        function openDomainFolders(domainId) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.remove('hidden');
            
            let grid = document.getElementById('pageContentGrid');
            grid.className = "grid grid-cols-2 gap-3 pb-6";
            let html = "";
            let items = domainFoldersData[domainId] || [];
            let rootObj = rootFolders.find(f => f.id == domainId);

            document.getElementById('pageTitle').innerText = rootObj ? rootObj.name : ("Folder #" + domainId);

            for (let i = 0; i < items.length; i++) {
                let f = items[i];
                html += `
                    <div class="card-3d p-3.5 rounded-2xl flex flex-col justify-between border border-amber-500/50 text-center relative">
                        <div class="space-y-1.5 mt-2">
                            <span class="text-2xl block">${f.icon}</span>
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${f.name}</h3>
                            <p class="text-[10px] text-slate-300">${f.desc}</p>
                        </div>
                        <a href="${f.link}" target="_blank" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl block text-[10px] shadow mt-3">Open ➔</a>
                    </div>
                `;
            }
            grid.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function goBackHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('subFolderPageView').classList.add('hidden');
        }
    </script>
</body>
</html>
