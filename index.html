<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES APP - Multi-Language Global Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
            transition: all 0.3s ease;
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body id="appBody" class="flex flex-col justify-between min-h-screen">

    <!-- Header Section -->
    <header class="p-2.5 text-center bg-slate-950/85 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-40 shadow-xl">
        <div class="flex justify-between items-center max-w-md mx-auto px-1">
            <div class="flex items-center gap-1.5 cursor-pointer" onclick="goBackHome()">
                <div class="w-8 h-8 rounded-full bg-amber-950 border border-amber-500/50 flex items-center justify-center text-xs overflow-hidden" id="headerLogoContainer">
                    <span id="headerLogoIcon">🦅</span>
                </div>
                <h1 id="headerMainTitle" class="text-sm font-black tracking-wider text-amber-400">OYES</h1>
            </div>
            
            <div class="flex items-center gap-1">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-900 text-amber-300 border border-amber-500/50 text-[10px] rounded-lg px-1.5 py-1 focus:outline-none">
                    <option value="en">English</option>
                    <option value="ml">മലയാളം</option>
                </select>
                <button type="button" onclick="requestAdminAccess()" class="bg-amber-950/80 text-amber-300 text-[10px] font-semibold border border-amber-500/60 rounded-lg px-2 py-1 shadow" title="Admin Panel">⚙️ Admin</button>
            </div>
        </div>
    </header>

    <!-- Admin Hidden File Managers (Strictly Admin Only) -->
    <input type="file" id="adminLogoFile" class="hidden" accept="image/*" onchange="handleAdminLogoUpload(event)">
    <input type="file" id="adminBgFile" class="hidden" accept="image/*" onchange="handleAdminBgUpload(event)">
    <input type="file" id="adminFolderBgFile" class="hidden" accept="image/*" onchange="handleAdminFolderBgUpload(event)">
    <input type="file" id="adminFolderPhotoFile" class="hidden" accept="image/*" onchange="handleAdminFolderPhotoUpload(event)">
    <input type="file" id="adminItemPhotoFile" class="hidden" accept="image/*" onchange="handleAdminItemPhotoUpload(event)">

    <!-- Admin Login Modal (Secret Code: salih9947) -->
    <div id="adminLoginModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/60 p-6 rounded-3xl max-w-xs w-full shadow-2xl space-y-4">
            <div class="text-center space-y-1">
                <h3 class="text-sm font-bold text-amber-300">Admin Security Control</h3>
                <p class="text-[11px] text-slate-400">Enter Security Code (salih9947):</p>
            </div>
            <input type="password" id="adminSecretInput" placeholder="Enter code..." class="w-full bg-slate-950 text-slate-200 px-3.5 py-2.5 rounded-xl border border-amber-600/50 text-xs text-center tracking-widest focus:outline-none">
            <div class="grid grid-cols-2 gap-2.5">
                <button type="button" onclick="closeAdminModal()" class="bg-slate-800 text-slate-300 text-xs py-2.5 rounded-xl font-bold">Cancel</button>
                <button type="button" onclick="verifyAdminCode()" class="bg-amber-600 text-white text-xs py-2.5 rounded-xl font-bold shadow">Verify</button>
            </div>
        </div>
    </div>

    <!-- AI Chat Assistant Modal -->
    <div id="aiModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-emerald-500/60 p-5 rounded-3xl max-w-sm w-full shadow-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 id="aiModalTitle" class="text-xs font-bold text-emerald-400">🤖 OYES AI Assistant</h3>
                <button type="button" onclick="closeAIModal()" class="text-slate-400 hover:text-white text-xs font-bold px-2 py-1">✕</button>
            </div>
            <div id="aiChatBox" class="bg-slate-950 p-3 rounded-xl h-40 overflow-y-auto text-[11px] text-slate-300 space-y-2 border border-slate-800">
                <p class="text-emerald-300">Hello! Ask me anything regarding this category...</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="aiUserInput" placeholder="Type your question..." class="flex-grow bg-slate-950 text-slate-200 px-3 py-2 rounded-xl border border-emerald-700/50 text-xs focus:outline-none">
                <button type="button" onclick="sendAIMessage()" class="bg-emerald-600 text-white text-xs px-4 py-2 rounded-xl font-bold shadow">Send</button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard View -->
    <main id="homeView" class="flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="bg-slate-900/95 border border-amber-500/40 p-4 rounded-3xl shadow-xl text-center space-y-2">
            <div class="w-20 h-20 mx-auto rounded-full bg-amber-500/20 border-2 border-amber-400/60 flex items-center justify-center text-3xl overflow-hidden" id="bannerLogoContainer">
                <span id="bannerLogoIcon">🌍🦅</span>
            </div>
            <div>
                <h2 id="bannerAppTitle" class="text-xl font-black tracking-widest text-amber-400">OYES GLOBAL HUB</h2>
                <p id="bannerSubtitle" class="text-[11px] text-amber-200 font-semibold tracking-wider mt-0.5">Embracing Change • Creating the Future</p>
            </div>
        </div>

        <div id="homeGridContainer" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Sub-Folders & Admin Settings View -->
    <div id="subFolderPageView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="goBackHome()" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Back</button>
            <h3 id="pageTitle" class="text-xs font-bold text-amber-300 text-right">Sub Page</h3>
        </div>
        <div id="pageContentGrid" class="grid grid-cols-2 gap-3 pb-6"></div>
    </div>

    <!-- Footer Section -->
    <footer class="p-4 text-center text-[10px] text-slate-400 border-t border-slate-800 bg-slate-950/90 space-y-2">
        <p id="footerText" class="font-medium text-slate-300">Change from within • The future through us</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const translations = {
            en: { bannerTitle: "OYES GLOBAL HUB", subtitle: "Embracing Change • Creating the Future", footer: "Change from within • The future through us" },
            ml: { bannerTitle: "ഒയേസ് ഗ്ലോബൽ ഹബ്ബ്", subtitle: "മാറ്റങ്ങളെ സ്വീകരിച്ച് • ഭാവിയെ സൃഷ്ടിച്ച്", footer: "മാറ്റം നമ്മിൽ നിന്ന് • ഭാവി നമ്മിലൂടെ" }
        };

        function changeLanguage(lang) {
            let t = translations[lang] || translations['en'];
            document.getElementById('bannerAppTitle').innerText = t.bannerTitle;
            document.getElementById('bannerSubtitle').innerText = t.subtitle;
            document.getElementById('footerText').innerText = t.footer;
            localStorage.setItem('oyes_lang', lang);
        }

        const defaultRootFolders = [
            { id: 1, name: "WORLD OF KNOWLEDGE", icon: "📖", image: "", slogan: "Connecting people • Uniting opportunities", bg: "", waNumber: "919947198248" },
            { id: 2, name: "JOB VACANCIES & CLEANING", icon: "💼", image: "", slogan: "Shift in thought • Progress in life", bg: "", waNumber: "919947198248" },
            { id: 3, name: "ULTIMATE HOME CONSTRUCTION SOLUTION", icon: "🏠", image: "", slogan: "Marbles, Granites, Kota, Vettukallu, Appliances & Workers", bg: "", waNumber: "919447276504" },
            { id: 4, name: "STAYS & HOTELS", icon: "🏨", image: "", slogan: "One connection • Endless possibilities", bg: "", waNumber: "919947198248" },
            { id: 5, name: "BUY & SELL MARKET HUB", icon: "🤝", image: "", slogan: "Your world • Your community", bg: "", waNumber: "919947198248" },
            { id: 6, name: "EVENTS & ADVERTISEMENTS", icon: "🌟", image: "", slogan: "Connect digitally • Move forward together", bg: "", waNumber: "919947198248" },
            { id: 7, name: "OYES CINEMA & STUDIO", icon: "🎬", image: "", slogan: "Skills awaken • Possibilities unfold", bg: "", waNumber: "919947198248" }
        ];

        let rootFolders = JSON.parse(localStorage.getItem('oyes_root_folders')) || defaultRootFolders;

        const perfectDomainData = {
            1: [
                {name: "Quran Online", icon: "📖", desc: "Digital Holy Quran reading portal.", link: "https://quran.com", image: ""},
                {name: "Holy Bible", icon: "✝️", desc: "Holy Bible reading portal.", link: "https://www.bible.com", image: ""},
                {name: "Bhagavad Gita", icon: "🕉️", desc: "Bhagavad Gita teachings.", link: "https://www.holy-bhagavad-gita.org", image: ""},
                {name: "Ramayana Epic", icon: "🛕", desc: "Ramayana ancient epic.", link: "https://archive.org", image: ""}
            ],
            2: [
                {name: "Job Vacancies Portal", icon: "📋", desc: "Local & government job updates, Kerala PSC notifications.", link: "https://keralapsc.gov.in", image: ""},
                {name: "House Deep Cleaning Services", icon: "🧹", desc: "Professional deep cleaning services for homes & offices.", link: "", image: ""},
                {name: "Water Tank Cleaning", icon: "🚰", desc: "Sump and overhead water tank cleaning services.", link: "", image: ""}
            ],
            3: [
                {name: "Statuario Italian Marble", icon: "🇮🇹", desc: "Premium Statuario white imported Italian marble with grey striking veins.", link: "", image: ""},
                {name: "Botticino Classic Marble", icon: "🇮🇹", desc: "Beige colored Italian marble ideal for luxury floorings and halls.", link: "", image: ""},
                {name: "Dyna & Travertine Marble", icon: "🇮🇹", desc: "Rich textured Dyna and natural Travertine Italian marbles.", link: "", image: ""},
                {name: "Makrana White Indian Marble", icon: "🇮🇳", desc: "World-famous pure white Makrana marble from Rajasthan.", link: "", image: ""},
                {name: "Banswara & Ambaji Marble", icon: "🇮🇳", desc: "Purple, pink and white Indian marble varieties.", link: "", image: ""},
                {name: "Natural Green & Brown Kota Stone", icon: "🟩", desc: "Durable green and brown Kota stones for paving and parking.", link: "", image: ""},
                {name: "Black Galaxy & Tan Brown Granite", icon: "🪨", desc: "High-grade kitchen countertops and flooring granites.", link: "", image: ""},
                {name: "Laterite Building Stone (വെട്ടുകല്ല്)", icon: "🧱", desc: "High quality local laterite stones for wall construction.", link: "", image: ""},
                {name: "Rough & Fine Granite Stones (കരിങ്കല്ല്)", icon: "🗿", desc: "Foundation and compound building black stones.", link: "", image: ""},
                {name: "Raw Boulders (ബോളർ കല്ലുകൾ)", icon: "⛰️", desc: "Large raw stones for retaining walls and landscaping.", link: "", image: ""},
                {name: "Metal Aggregates (മെറ്റൽ 20mm/40mm)", icon: "⚙️", desc: "Crushed blue metal aggregates for concrete casting.", link: "", image: ""},
                {name: "Vitrified & Elevation Tiles", icon: "🏛️", desc: "Ceramic floor tiles and 3D outdoor wall cladding stones.", link: "", image: ""},
                {name: "Home Appliances & Electronics", icon: "🌀", desc: "ACs, Refrigerators, Washing machines, TVs and Geysers.", link: "", image: ""},
                {name: "Luxury Furniture (Sofas & Beds)", icon: "🛋️", desc: "Designer wooden beds, luxury sofas and dining tables.", link: "", image: ""},
                {name: "Kitchenware (Stove to Spoons)", icon: "🥄", desc: "Complete kitchen set items from spoons and cookwares to stoves.", link: "", image: ""},
                {name: "Electrical, Plumbing & Hardware", icon: "💡", desc: "Wires, switches, LED lights, PVC pipes, taps, paints and putty.", link: "", image: ""},
                {name: "Construction Masons & Labours", icon: "👷", desc: "Expert stone masons, tile fixers, plumbers and electricians.", link: "", image: ""}
            ],
            4: [
                {name: "Wayanad Stays", icon: "⛰️", desc: "Resorts and homestays in Wayanad.", link: "https://www.booking.com", image: ""},
                {name: "Kozhikode Hotels", icon: "🌊", desc: "Stays in Kozhikode district.", link: "https://www.booking.com", image: ""},
                {name: "Kochi Stays", icon: "🏙️", desc: "Hotels in Ernakulam / Kochi.", link: "https://www.booking.com", image: ""}
            ],
            5: [
                {name: "Cows & Goats (Live Stock)", icon: "🐄", desc: "Buy and sell pets & farm animals.", link: "", image: ""},
                {name: "Real Estate Hub", icon: "🏡", desc: "Houses, plots and lands for sale.", link: "", image: ""},
                {name: "Vehicles Market", icon: "🚗", desc: "Cars and bikes buy/sell portal.", link: "", image: ""}
            ],
            6: [
                {name: "All Advertisements", icon: "📢", desc: "Digital, print & commercial ads.", link: "", image: ""},
                {name: "Events Management", icon: "🎉", desc: "Hosting, anchoring & event setup.", link: "", image: ""}
            ],
            7: [
                {name: "Pro Studio & Editing", icon: "🎛️", desc: "Free video, audio & VFX editing tools.", link: "https://clipchamp.com", image: ""},
                {name: "Kids Cartoons", icon: "🧸", desc: "Entertainment & cartoons for kids.", link: "https://www.youtube.com", image: ""},
                {name: "Short Films & Cinema Hub", icon: "🎥", desc: "Watch short films, movies and cinema productions.", link: "https://www.youtube.com", image: ""}
            ]
        };

        let domainFoldersData = JSON.parse(localStorage.getItem('oyes_domains')) || perfectDomainData;

        function renderHomeGrid() {
            let container = document.getElementById('homeGridContainer');
            let html = "";
            rootFolders.forEach((folder, idx) => {
                let isFullSpan = (idx === 6) ? "col-span-2 max-w-[200px] mx-auto w-full" : "";
                let displayFolderIconOrImg = folder.image ? `<img src="${folder.image}" class="w-12 h-12 mx-auto object-cover rounded-full border border-amber-500/50 shadow">` : `<span class="text-3xl block">${folder.icon}</span>`;
                html += `
                    <div onclick="openDomainFolders(${folder.id})" class="card-3d p-3.5 rounded-2xl cursor-pointer flex flex-col justify-between border border-amber-500/40 text-center ${isFullSpan}">
                        <div class="space-y-1.5 mt-1">
                            ${displayFolderIconOrImg}
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${folder.name}</h3>
                            <p class="text-[9px] text-slate-300">${folder.slogan}</p>
                        </div>
                        <div class="flex gap-1 mt-3">
                            <span class="bg-amber-600/80 hover:bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-xl flex-1 text-[10px] shadow">Open ➔</span>
                            <span onclick="event.stopPropagation(); openAIModal('${folder.name}')" class="bg-emerald-600/80 text-white font-bold px-2 py-1 rounded-xl text-[10px] shadow" title="AI Assistant">🤖 AI</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            let savedLang = localStorage.getItem('oyes_lang') || 'en';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
            renderHomeGrid();
            loadPersistentCustomizations();
        });

        function loadPersistentCustomizations() {
            let savedLogo = localStorage.getItem('oyes_custom_logo');
            if (savedLogo) {
                document.getElementById('headerLogoContainer').innerHTML = `<img src="${savedLogo}" class="w-full h-full object-cover rounded-full">`;
                document.getElementById('bannerLogoContainer').innerHTML = `<img src="${savedLogo}" class="w-full h-full object-cover rounded-full">`;
            }
            let savedBg = localStorage.getItem('oyes_custom_bg');
            if (savedBg) {
                document.getElementById('appBody').style.backgroundImage = `url('${savedBg}')`;
            }
        }

        let currentAiDomain = "";
        function openAIModal(domainName) {
            currentAiDomain = domainName;
            document.getElementById('aiModalTitle').innerText = `🤖 OYES AI (${domainName})`;
            document.getElementById('aiChatBox').innerHTML = `<p class="text-emerald-300">Hello! I am your AI assistant for ${domainName}. Ask me anything!</p>`;
            document.getElementById('aiModal').classList.remove('hidden');
        }

        function closeAIModal() {
            document.getElementById('aiModal').classList.add('hidden');
        }

        function sendAIMessage() {
            let input = document.getElementById('aiUserInput');
            let msg = input.value.trim();
            if (!msg) return;

            let chatBox = document.getElementById('aiChatBox');
            chatBox.innerHTML += `<p class="text-right text-slate-200"><b>You:</b> ${msg}</p>`;
            input.value = "";

            setTimeout(() => {
                chatBox.innerHTML += `<p class="text-emerald-400"><b>OYES AI:</b> Received query regarding "${currentAiDomain}". Processing response successfully!</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        // --- ADMIN ONLY FILE UPLOAD HANDLERS ---
        let selectedFolderBgIndex = null;
        let selectedFolderPhotoIndex = null;
        let selectedItemDomainId = null;
        let selectedItemIndex = null;

        function openAdminLogoPicker() { document.getElementById('adminLogoFile').click(); }
        function handleAdminLogoUpload(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('oyes_custom_logo', e.target.result);
                    loadPersistentCustomizations();
                    alert("Admin: App Logo updated successfully!");
                    openAdminSettings();
                };
                reader.readAsDataURL(file);
            }
        }

        function openAdminBgPicker() { document.getElementById('adminBgFile').click(); }
        function handleAdminBgUpload(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('oyes_custom_bg', e.target.result);
                    loadPersistentCustomizations();
                    alert("Admin: Global Background updated successfully!");
                    openAdminSettings();
                };
                reader.readAsDataURL(file);
            }
        }

        function openAdminFolderBgPicker(idx) {
            selectedFolderBgIndex = idx;
            document.getElementById('adminFolderBgFile').click();
        }
        function handleAdminFolderBgUpload(event) {
            let file = event.target.files[0];
            if (file && selectedFolderBgIndex !== null) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    rootFolders[selectedFolderBgIndex].bg = e.target.result;
                    localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
                    alert("Admin: Folder background updated successfully!");
                    openAdminSettings();
                };
                reader.readAsDataURL(file);
            }
        }

        function openAdminFolderPhotoPicker(idx) {
            selectedFolderPhotoIndex = idx;
            document.getElementById('adminFolderPhotoFile').click();
        }
        function handleAdminFolderPhotoUpload(event) {
            let file = event.target.files[0];
            if (file && selectedFolderPhotoIndex !== null) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    rootFolders[selectedFolderPhotoIndex].image = e.target.result;
                    localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
                    renderHomeGrid();
                    alert("Admin: Folder photo/icon updated successfully!");
                    openAdminSettings();
                };
                reader.readAsDataURL(file);
            }
        }

        function openAdminItemPhotoPicker(domainId, idx) {
            selectedItemDomainId = domainId;
            selectedItemIndex = idx;
            document.getElementById('adminItemPhotoFile').click();
        }
        function handleAdminItemPhotoUpload(event) {
            let file = event.target.files[0];
            if (file && selectedItemDomainId !== null && selectedItemIndex !== null) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    domainFoldersData[selectedItemDomainId][selectedItemIndex].image = e.target.result;
                    localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                    alert("Admin: Item photo updated successfully!");
                    openAdminSettings();
                };
                reader.readAsDataURL(file);
            }
        }

        function requestAdminAccess() {
            document.getElementById('adminSecretInput').value = "";
            document.getElementById('adminLoginModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminLoginModal').classList.add('hidden');
        }

        function verifyAdminCode() {
            let code = document.getElementById('adminSecretInput').value.trim();
            if (code === "salih9947") {
                closeAdminModal();
                alert("Admin Access Verified Successfully!");
                openAdminSettings();
            } else {
                alert("Incorrect Security Code!");
            }
        }

        function openAdminSettings() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.remove('hidden');
            document.getElementById('pageTitle').innerText = "Admin Panel - Permanent Settings";
            
            let grid = document.getElementById('pageContentGrid');
            grid.className = "grid grid-cols-1 gap-3.5 pb-6";
            
            let editHtml = `
                <div class="card-3d p-4 rounded-2xl text-center space-y-3 border border-amber-500/60">
                    <h4 class="text-amber-300 font-bold text-xs">Admin Global Branding Controls</h4>
                    <div class="flex gap-2 justify-center flex-wrap">
                        <button type="button" onclick="openAdminLogoPicker()" class="bg-indigo-600 text-white font-bold text-[10px] px-3 py-2 rounded-xl shadow">🖼️ Change Logo</button>
                        <button type="button" onclick="openAdminBgPicker()" class="bg-indigo-600 text-white font-bold text-[10px] px-3 py-2 rounded-xl shadow">🖼️ Change Global BG</button>
                    </div>
                </div>

                <div class="card-3d p-4 rounded-2xl space-y-3 text-left">
                    <h4 class="text-cyan-300 font-bold text-xs">Manage Folders, Photos, WhatsApp & Backgrounds:</h4>
            `;

            rootFolders.forEach((folder, idx) => {
                let folderImgPrev = folder.image ? `<img src="${folder.image}" class="w-8 h-8 object-cover rounded">` : `<span class="text-[10px] text-slate-500">No Img</span>`;
                editHtml += `
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-700 space-y-2 text-[11px]">
                        <div class="flex gap-2 items-center">
                            ${folderImgPrev}
                            <input type="text" id="root_icon_${idx}" value="${folder.icon}" class="w-10 bg-slate-900 text-center text-amber-300 p-1.5 rounded border border-slate-700 text-xs">
                            <input type="text" id="root_name_${idx}" value="${folder.name}" class="flex-grow bg-slate-900 text-slate-200 p-1.5 rounded border border-slate-700 text-xs font-bold">
                        </div>
                        <input type="text" id="root_slogan_${idx}" value="${folder.slogan}" class="w-full bg-slate-900 text-slate-300 p-1 rounded border border-slate-700 text-[10px]">
                        <div class="flex gap-2 items-center">
                            <span class="text-[10px] text-amber-300 font-semibold">WhatsApp No:</span>
                            <input type="text" id="root_wa_${idx}" value="${folder.waNumber || '919947198248'}" class="flex-grow bg-slate-900 text-slate-200 p-1 rounded border border-slate-700 text-[10px]">
                        </div>
                        <div class="flex gap-2 pt-1 flex-wrap">
                            <button type="button" onclick="updateRootFolder(${idx})" class="bg-emerald-600 text-white px-3 py-1 rounded text-[10px] font-bold">Save Details</button>
                            <button type="button" onclick="openAdminFolderPhotoPicker(${idx})" class="bg-indigo-600 text-white px-3 py-1 rounded text-[10px] font-bold">📷 Folder Photo</button>
                            <button type="button" onclick="openAdminFolderBgPicker(${idx})" class="bg-purple-600 text-white px-3 py-1 rounded text-[10px] font-bold">🖼️ Folder BG</button>
                        </div>
                    </div>
                `;
            });
            editHtml += `</div>`;

            for (let dId in domainFoldersData) {
                let items = domainFoldersData[dId];
                let rootName = rootFolders.find(f => f.id == dId)?.name || `Folder ${dId}`;
                editHtml += `<div class="card-3d p-3 rounded-2xl space-y-2 text-left"><h4 class="text-amber-300 font-bold text-xs">Sub-Items under "${rootName}":</h4>`;
                for (let idx = 0; idx < items.length; idx++) {
                    let item = items[idx];
                    let imgPreview = item.image ? `<img src="${item.image}" class="w-8 h-8 object-cover rounded">` : `<span class="text-[10px] text-slate-500">No Img</span>`;
                    editHtml += `
                        <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-700 flex gap-2 items-center text-[11px]">
                            ${imgPreview}
                            <input type="text" id="sub_icon_${dId}_${idx}" value="${item.icon}" class="w-7 bg-slate-900 text-center p-1 rounded border border-slate-700 text-xs">
                            <input type="text" id="sub_name_${dId}_${idx}" value="${item.name}" class="flex-grow bg-slate-900 text-slate-200 p-1 rounded border border-slate-700 text-[10px]">
                            <button type="button" onclick="openAdminItemPhotoPicker(${dId}, ${idx})" class="bg-indigo-600 text-white px-2 py-1 rounded text-[10px]">📷 Photo</button>
                            <button type="button" onclick="updateSubItemName(${dId}, ${idx})" class="bg-emerald-700 text-white px-2 py-1 rounded text-[10px]">Save</button>
                            <button type="button" onclick="deleteSubItem(${dId}, ${idx})" class="bg-rose-700 text-white px-2 py-1 rounded text-[10px]">Delete</button>
                        </div>
                    `;
                }
                editHtml += `
                    <div class="mt-2 pt-2 border-t border-slate-800 flex gap-1">
                        <input type="text" id="new_sub_name_${dId}" placeholder="New sub-folder name..." class="flex-grow bg-slate-900 text-slate-200 p-1 rounded border border-slate-700 text-[10px]">
                        <button type="button" onclick="addNewSubItem(${dId})" class="bg-blue-600 text-white px-3 py-1 rounded text-[10px] font-bold">+ Add Sub-Folder</button>
                    </div>
                `;
            }

            grid.innerHTML = editHtml;
        }

        function updateRootFolder(index) {
            let newIcon = document.getElementById(`root_icon_${index}`).value.trim();
            let newName = document.getElementById(`root_name_${index}`).value.trim();
            let newSlogan = document.getElementById(`root_slogan_${index}`).value.trim();
            let newWa = document.getElementById(`root_wa_${index}`).value.trim();
            if (newName) {
                rootFolders[index].icon = newIcon || "📁";
                rootFolders[index].name = newName;
                rootFolders[index].slogan = newSlogan;
                rootFolders[index].waNumber = newWa || "919947198248";
                localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
                renderHomeGrid();
                alert("Root folder updated permanently!");
                openAdminSettings();
            }
        }

        function updateSubItemName(domainId, index) {
            let newName = document.getElementById(`sub_name_${domainId}_${index}`).value.trim();
            let newIcon = document.getElementById(`sub_icon_${domainId}_${index}`).value.trim();
            if (newName) {
                domainFoldersData[domainId][index].name = newName;
                domainFoldersData[domainId][index].icon = newIcon || "📁";
                localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                alert("Sub-item updated successfully!");
                openAdminSettings();
            }
        }

        function deleteSubItem(domainId, index) {
            if (confirm("Are you sure you want to delete this sub-folder?")) {
                domainFoldersData[domainId].splice(index, 1);
                localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                alert("Deleted successfully!");
                openAdminSettings();
            }
        }

        function addNewSubItem(domainId) {
            let inputField = document.getElementById(`new_sub_name_${domainId}`);
            let name = inputField.value.trim();
            if (name) {
                if (!domainFoldersData[domainId]) domainFoldersData[domainId] = [];
                domainFoldersData[domainId].push({
                    name: name,
                    icon: "📁",
                    desc: "Custom created sub-folder item.",
                    link: "",
                    image: ""
                });
                localStorage.setItem('oyes_domains', JSON.stringify(domainFoldersData));
                inputField.value = "";
                alert("New sub-folder created successfully!");
                openAdminSettings();
            }
        }

        function openDomainFolders(domainId) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.remove('hidden');
            
            let rootObj = rootFolders.find(f => f.id == domainId);
            if (rootObj && rootObj.bg) {
                document.getElementById('appBody').style.backgroundImage = `url('${rootObj.bg}')`;
            }

            let grid = document.getElementById('pageContentGrid');
            grid.className = "grid grid-cols-2 gap-3 pb-6";
            let html = "";
            let items = domainFoldersData[domainId] || [];
            let folderWaNumber = rootObj?.waNumber || "919947198248";

            document.getElementById('pageTitle').innerText = rootObj ? rootObj.name : ("Folder #" + domainId);

            for (let i = 0; i < items.length; i++) {
                let f = items[i];
                let displayIconOrImg = f.image ? `<img src="${f.image}" class="w-12 h-12 mx-auto object-cover rounded-xl border border-amber-500/50 shadow">` : `<span class="text-3xl block">${f.icon}</span>`;
                
                let destinationLink = f.link ? f.link : `https://wa.me/${folderWaNumber}?text=` + encodeURIComponent("Inquiry about " + f.name);

                html += `
                    <div class="card-3d p-3.5 rounded-2xl flex flex-col justify-between border border-amber-500/50 text-center relative">
                        <div class="space-y-1.5 mt-1">
                            ${displayIconOrImg}
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${f.name}</h3>
                            <p class="text-[10px] text-slate-300">${f.desc}</p>
                        </div>
                        <a href="${destinationLink}" target="_blank" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl block text-[10px] shadow mt-3">Open ➔</a>
                    </div>
                `;
            }
            grid.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function goBackHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('subFolderPageView').classList.add('hidden');
            loadPersistentCustomizations();
        }
    </script>
</body>
</html>
