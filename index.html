<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES GLOBAL HUB - Perfect Master Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
            background-size: cover;
            background-position: center;
            transition: all 0.3s ease;
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.7);
            transform: translateY(-2px);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20" id="mainBody">

    <!-- Top Header -->
    <header class="p-3 bg-slate-950/85 backdrop-blur-xl border-b border-slate-80
