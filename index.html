<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES GLOBAL HUB - Complete Customizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
            background-size: cover;
            background-position: center;
            transition: all 0.3s ease;
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.7);
            transform: translateY(-2px);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20" id="mainBody">

    <!-- Top Header -->
    <header class="p-3 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="flex justify-between items-center max-w-md mx-auto px-1">
            <button class="text-amber-400 text-xl font-bold p-1">☰</button>
            <div class="flex items-center gap-1.5 cursor-pointer" onclick="goHome()">
                <div id="appLogoDisplay" class="w-9 h-9 rounded-full bg-amber-950 border border-amber-500/50 flex items-center justify-center text-xs overflow-hidden shadow">
                    <span>🦅</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <select class="bg-slate-900 text-amber-300 border border-amber-500/50 text-[10px] rounded-lg px-2 py-1 outline-none">
                    <option value="en">English ▾</option>
                    <option value="ml">മലയാളം</option>
                </select>
                <button onclick="requestAdminAccess()" class="bg-amber-950/80 text-amber-300 text-[10px] font-semibold border border-amber-500/60 rounded-lg px-2.5 py-1 shadow">⚙️ Admin</button>
            </div>
        </div>
    </header>

    <!-- Admin Panel (Password Protected: admin) -->
    <div id="adminPanelBox" class="max-w-md mx-auto w-full bg-slate-900/95 border-b border-amber-500/50 p-4 hidden space-y-3 z-40 shadow-2xl">
        <div class="flex justify-between items-center">
            <h3 class="text-amber-400 font-bold text-xs uppercase tracking-wider">🔒 Admin Control Panel</h3>
            <button onclick="lockAdminPanel()" class="text-xs bg-red-900/80 text-white px-2 py-0.5 rounded font-bold">Lock 🔒</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="document.getElementById('logoFileInput').click()" class="bg-amber-600/80 text-slate-950 font-bold p-2 rounded-xl text-[10px] shadow">🖼️ Change App Logo</button>
            <button onclick="document.getElementById('bgFileInput').click()" class="bg-amber-600/80 text-slate-950 font-bold p-2 rounded-xl text-[10px] shadow">🌅 Change App BG</button>
            <button onclick="promptFolderCustomization('bg')" class="bg-blue-600/80 text-white font-bold p-2 rounded-xl text-[10px] shadow">📁 Folder Background</button>
            <button onclick="promptFolderCustomization('icon')" class="bg-blue-600/80 text-white font-bold p-2 rounded-xl text-[10px] shadow">🔖 Folder Icon Photo</button>
            <button onclick="resetAppSettings()" class="bg-red-900/80 text-white font-bold p-2 rounded-xl text-[10px] shadow col-span-2">🔄 Reset Defaults</button>
        </div>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="logoFileInput" class="hidden" accept="image/*" onchange="applyGlobalLogo(event)">
    <input type="file" id="bgFileInput" class="hidden" accept="image/*" onchange="applyGlobalBackground(event)">
    <input type="file" id="folderBgInput" class="hidden" accept="image/*" onchange="applyFolderBgFile(event)">
    <input type="file" id="folderIconInput" class="hidden" accept="image/*" onchange="applyFolderIconFile(event)">
    <input type="file" id="itemPhotoInput" class="hidden" accept="image/*" onchange="processItemPhotoUpload(event)">

    <!-- Main Dashboard View (Original Home Page Grid) -->
    <main id="homeView" class="flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="bg-slate-900/95 border border-amber-500/40 p-4 rounded-3xl shadow-xl text-center space-y-3">
            <div class="w-20 h-20 mx-auto rounded-full bg-amber-500/20 border-2 border-amber-400/60 flex items-center justify-center text-3xl overflow-hidden shadow-xl">
                <span>🌍🦅</span>
            </div>
            <div>
                <h2 class="text-lg font-black tracking-widest text-amber-400">CONNECTING PEOPLE</h2>
                <h2 class="text-lg font-black tracking-widest text-amber-400">UNITING OPPORTUNITIES</h2>
                <p class="text-[10px] text-amber-200 font-semibold tracking-wider mt-0.5">OYES — A WORLD OF OPPORTUNITIES</p>
            </div>
            <div class="relative mt-2">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-amber-400 text-xs">🔍</span>
                <input type="text" placeholder="Search anything on OYES..." class="w-full bg-slate-950/80 border border-amber-500/30 rounded-2xl py-2 pl-9 pr-9 text-[11px] text-slate-200 focus:outline-none focus:border-amber-400">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3" id="mainHomeGrid"></div>
    </main>

    <!-- Sub-folder Grid View -->
    <main id="subFolderView" class="max-w-md mx-auto p-4 w-full space-y-3 hidden flex-grow">
        <div class="flex justify-between items-center mb-2">
            <button onclick="goHome()" class="bg-amber-500/20 border border-amber-500/50 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-semibold">⬅️ Back to Home</button>
            <button id="addItemBtn" onclick="openAddItemPrompt()" class="bg-emerald-600/80 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow hidden">➕ Add Product / File</button>
        </div>
        <div id="subFolderContainer" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Bottom Navigation Footer -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-950/90 backdrop-blur-xl border-t border-amber-500/20 py-2.5 px-4 flex justify-around items-center z-50">
        <button onclick="goHome()" class="flex flex-col items-center text-amber-400 text-[10px] font-bold"><span class="text-lg">🏠</span>Home</button>
        <button onclick="openDomain(1)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium"><span class="text-lg">📖</span>Books</button>
        <button onclick="openDomain(2)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium"><span class="text-lg">💼</span>Jobs</button>
        <button onclick="openDomain(7)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium"><span class="text-lg">🎬</span>Cinema</button>
        <button onclick="openDomain(5)" class="flex flex-col items-center text-slate-400 hover:text-amber-400 text-[10px] font-medium"><span class="text-lg">👥</span>Entertainment</button>
    </nav>

    <!-- JavaScript Engine -->
    <script>
        let currentDomainId = null;
        let isAdminLoggedIn = false;
        let targetFolderIdForCustom = null;
        let pendingItemData = null;

        const defaultMainFolders = [
            { id: 1, name: "WORLD OF KNOWLEDGE", desc: "Connecting people Uniting opportunities", icon: "📖", bg: "" },
            { id: 2, name: "JOB VACANCIES & CLEANING", desc: "Shift in thought Progress in life", icon: "💼", bg: "" },
            { id: 3, name: "ULTIMATE HOME CONSTRUCTION SOLUTION", desc: "Marbles, Granites, Kota, Vettukallu, Appliances & Workers", icon: "🏠", bg: "" },
            { id: 4, name: "STAYS & HOTELS", desc: "One connection Endless possibilities", icon: "🏨", bg: "" },
            { id: 5, name: "BUY & SELL MARKET HUB", desc: "Your world Your community", icon: "🤝", bg: "" },
            { id: 6, name: "EVENTS & ADVERTISEMENTS", desc: "Connect digitally Move forward together", icon: "⭐", bg: "" },
            { id: 7, name: "OYES CINEMA & STUDIO", desc: "Watch • Upload • Sell • Earn", icon: "🎥", bg: "", fullWidth: true }
        ];

        const defaultDomainData = {
            1: [
                {name: "Quran Online", icon: "📖", price: "Free", desc: "Digital Holy Quran reading portal.", link: "https://quran.com"},
                {name: "Holy Bible", icon: "✝️", price: "Free", desc: "Holy Bible reading portal.", link: "https://www.bible.com"},
                {name: "Bhagavad Gita", icon: "🕉️", price: "Free", desc: "Bhagavad Gita teachings and verses.", link: "https://www.holy-bhagavad-gita.org"},
                {name: "Ramayana Epic", icon: "🏹", price: "Free", desc: "Ramayana ancient epic scriptures.", link: "https://archive.org"}
            ],
            2: [
                {name: "House Deep Cleaning", icon: "🧹", price: "₹1,499", desc: "Professional deep cleaning service.", link: "https://wa.me/919947198248?text=Cleaning"},
                {name: "Water Tank Cleaning", icon: "🚿", price: "₹799", desc: "Sump and overhead tank cleaning.", link: "https://wa.me/919947198248?text=Tank"},
                {name: "Job Vacancies", icon: "📋", price: "Updates", desc: "Local & government job portals.", link: "https://keralapsc.gov.in"}
            ],
            3: [
                {name: "Worldwide Marble Hub", icon: "🏛️", price: "View Catalog", desc: "Explore world-class marble varieties from across the globe.", link: "https://drive.google.com/file/d/1juyK-1-_oz0N8mNpoQl3WphDihPH1KQe/view?usp=drivesdk"},
                {name: "Granites & Marbles", icon: "🧱", price: "₹120/sq.ft", desc: "Italian marble, Indian granite & flooring stones.", link: "https://wa.me/919947198248?text=Granite"},
                {name: "Tiles & Sanitary Wares", icon: "🧮", price: "Best Rates", desc: "Floor tiles, wall tiles, washbasins & toilets.", link: "https://wa.me/919947198248?text=Tiles"},
                {name: "Home Appliances", icon: "🌀", price: "Inquire", desc: "AC, TVs, refrigerators & ceiling fans.", link: "https://wa.me/919947198248?text=Appliances"},
                {name: "Furniture Hub", icon: "🛋️", price: "Luxury", desc: "Sofas, wooden beds & dining tables.", link: "https://wa.me/919947198248?text=Furniture"}
            ],
            4: [
                {name: "Wayanad Stays", icon: "⛰️", price: "₹2,500/day", desc: "Resorts and homestays in Wayanad.", link: "https://www.booking.com"},
                {name: "Kozhikode Hotels", icon: "🌊", price: "₹1,800/day", desc: "Stays in Kozhikode district.", link: "https://www.booking.com"}
            ],
            5: [
                {name: "Buy & Sell Market", icon: "🤝", price: "Direct", desc: "Your world, your community trading hub.", link: "https://wa.me/919947198248?text=Market"}
            ],
            6: [
                {name: "Events & Ads", icon: "⭐", price: "Promote", desc: "Connect digitally, move forward together.", link: "https://wa.me/919947198248?text=Events"}
            ],
            7: [
                {name: "OYES Cinema & Studio", icon: "🎬", price: "Earn", desc: "Watch, Upload, Sell & Earn from movies.", link: "https://wa.me/919947198248?text=Cinema"}
            ]
        };

        function getMainFolders() {
            const saved = localStorage.getItem('oyesMainFolders');
            return saved ? JSON.parse(saved) : defaultMainFolders;
        }

        function saveMainFolders(folders) {
            localStorage.setItem('oyesMainFolders', JSON.stringify(folders));
        }

        function getDomainData() {
            const saved = localStorage.getItem('oyesDomainData');
            return saved ? JSON.parse(saved) : defaultDomainData;
        }

        function saveDomainData(data) {
            localStorage.setItem('oyesDomainData', JSON.stringify(data));
        }

        function renderHome() {
            const folders = getMainFolders();
            const container = document.getElementById('mainHomeGrid');
            container.innerHTML = "";

            folders.forEach(folder => {
                const card = document.createElement('div');
                card.className = folder.fullWidth ? "card-3d p-4 rounded-2xl cursor-pointer flex items-center justify-between col-span-2" : "card-3d p-3.5 rounded-2xl cursor-pointer flex flex-col justify-between text-center";
                
                if (folder.bg) card.style.backgroundImage = `url('${folder.bg}')`;
                card.setAttribute('onclick', `openDomain(${folder.id})`);

                let iconDisplay = folder.icon;
                if (folder.icon && (folder.icon.startsWith('data:') || folder.icon.startsWith('http'))) {
                    iconDisplay = `<img src="${folder.icon}" class="w-10 h-10 mx-auto object-cover rounded-xl shadow">`;
                }

                if (folder.fullWidth) {
                    card.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="text-3xl">${iconDisplay}</span>
                            <div>
                                <h3 class="font-bold text-xs text-amber-300">${folder.name}</h3>
                                <p class="text-[9px] text-slate-300">${folder.desc}</p>
                            </div>
                        </div>
                        <span class="w-7 h-7 rounded-full bg-amber-500/25 border border-amber-500/50 flex items-center justify-center text-amber-300 text-xs font-bold">➔</span>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="space-y-1.5 mt-1">
                            <span class="text-3xl block">${iconDisplay}</span>
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${folder.name}</h3>
                            <p class="text-[9px] text-slate-300">${folder.desc}</p>
                        </div>
                        <div class="flex justify-end mt-3">
                            <span class="w-6 h-6 rounded-full bg-amber-500/25 border border-amber-500/50 flex items-center justify-center text-amber-300 text-xs">➔</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        function openDomain(domainId) {
            currentDomainId = domainId;
            const allData = getDomainData();
            const items = allData[domainId] || [];
            const container = document.getElementById('subFolderContainer');
            container.innerHTML = "";

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "card-3d p-3.5 rounded-2xl flex flex-col justify-between text-center relative";
                
                let deleteBtn = "";
                if (isAdminLoggedIn) {
                    deleteBtn = `<button onclick="event.stopPropagation(); deleteItem(${domainId}, ${index})" class="absolute top-2 right-2 text-[9px] bg-red-900/80 text-white px-1.5 py-0.5 rounded shadow font-bold z-10">🗑️</button>`;
                }

                let mediaDisplay = `<span class="text-3xl block">${item.icon}</span>`;
                if (item.icon && (item.icon.startsWith('data:') || item.icon.startsWith('http'))) {
                    mediaDisplay = `<div class="w-full h-24 rounded-xl overflow-hidden mb-2 border border-amber-500/30"><img src="${item.icon}" class="w-full h-full object-cover"></div>`;
                }

                let priceTag = item.price ? `<span class="inline-block bg-amber-500/20 text-amber-300 text-[9px] font-bold px-2 py-0.5 rounded-full border border-amber-500/40 my-1">🏷️ ${item.price}</span>` : "";

                card.innerHTML = `
                    ${deleteBtn}
                    <div class="space-y-1 mt-1">
                        ${mediaDisplay}
                        <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${item.name}</h3>
                        ${priceTag}
                        <p class="text-[9px] text-slate-300 leading-tight">${item.desc}</p>
                    </div>
                    <div class="mt-3">
                        <a href="${item.link}" target="_blank" class="bg-amber-600/80 hover:bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-[10px] shadow block w-full">Open / View ➔</a>
                    </div>
                `;
                container.appendChild(card);
            });

            if (isAdminLoggedIn) {
                document.getElementById('addItemBtn').classList.remove('hidden');
            } else {
                document.getElementById('addItemBtn').classList.add('hidden');
            }

            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('subFolderView').classList.remove('hidden');
        }

        function goHome() {
            document.getElementById('subFolderView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            renderHome();
        }

        function requestAdminAccess() {
            if (isAdminLoggedIn) {
                document.getElementById('adminPanelBox').classList.toggle('hidden');
                return;
            }
            let pwd = prompt("Enter Admin Password (default: admin):");
            if (pwd === "admin") {
                isAdminLoggedIn = true;
                document.getElementById('adminPanelBox').classList.remove('hidden');
                alert("അഡ്മിൻ പ്രവേശനം വിജയം!");
                renderHome();
                if(currentDomainId !== null) openDomain(currentDomainId);
            } else if (pwd !== null) {
                alert("പാസ്‌വേഡ് തെറ്റാണ്!");
            }
        }

        function lockAdminPanel() {
            isAdminLoggedIn = false;
            document.getElementById('adminPanelBox').classList.add('hidden');
            alert("അഡ്മിൻ പാനൽ ലോക്ക് ചെയ്തു.");
            renderHome();
            if(currentDomainId !== null) openDomain(currentDomainId);
        }

        function applyGlobalLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('appLogoDisplay').innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-full">`;
                    localStorage.setItem('appLogo', e.target.result);
                    alert("ലോഗോ സേവ് ചെയ്തു!");
                }
                reader.readAsDataURL(file);
            }
        }

        function applyGlobalBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url('${e.target.result}')`;
                    localStorage.setItem('appBg', e.target.result);
                    alert("ബാക്ക്ഗ്രൗണ്ട് സേവ് ചെയ്തു!");
                }
                reader.readAsDataURL(file);
            }
        }

        function promptFolderCustomization(type) {
            let id = prompt("Enter Folder ID (1 to 7):");
            let folders = getMainFolders();
            let folder = folders.find(f => f.id == id);
            if (folder) {
                targetFolderIdForCustom = id;
                if (type === 'bg') document.getElementById('folderBgInput').click();
                else document.getElementById('folderIconInput').click();
            } else {
                alert("ഫോൾഡർ കണ്ടെത്തിയില്ല!");
            }
        }

        function applyFolderBgFile(event) {
            const file = event.target.files[0];
            if (file && targetFolderIdForCustom) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let folders = getMainFolders();
                    let folder = folders.find(f => f.id == targetFolderIdForCustom);
                    if (folder) {
                        folder.bg = e.target.result;
                        saveMainFolders(folders);
                        renderHome();
                        alert("ഫോൾഡർ ബാക്ക്ഗ്രൗണ്ട് സേവ് ചെയ്തു!");
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function applyFolderIconFile(event) {
            const file = event.target.files[0];
            if (file && targetFolderIdForCustom) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let folders = getMainFolders();
                    let folder = folders.find(f => f.id == targetFolderIdForCustom);
                    if (folder) {
                        folder.icon = e.target.result;
                        saveMainFolders(folders);
                        renderHome();
                        alert("ഫോൾഡർ ഐക്കൺ സേവ് ചെയ്തു!");
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function openAddItemPrompt() {
            let name = prompt("Enter Item Name (e.g. Italian Marble):");
            let price = prompt("Enter Price / Rate (e.g. ₹150/sq.ft):", "₹");
            let desc = prompt("Enter Details / Description:");
            let link = prompt("Enter Link (Drive / WhatsApp / Web URL):", "https://");

            if (name) {
                pendingItemData = { name, price: price || "", desc: desc || "", link: link || "#" };
                alert("ഇനി ഗാലറിയിൽ നിന്ന് ഈ ഐറ്റത്തിന്റെ ഫോട്ടോ സെലക്ട് ചെയ്യുക!");
                document.getElementById('itemPhotoInput').click();
            }
        }

        function processItemPhotoUpload(event) {
            const file = event.target.files[0];
            if (file && pendingItemData) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const allData = getDomainData();
                    if (!allData[currentDomainId]) allData[currentDomainId] = [];
                    allData[currentDomainId].push({
                        name: pendingItemData.name,
                        icon: e.target.result,
                        price: pendingItemData.price,
                        desc: pendingItemData.desc,
                        link: pendingItemData.link
                    });
                    saveDomainData(allData);
                    openDomain(currentDomainId);
                    alert("ഫോട്ടോയും വിവരങ്ങളും സഹിതം പ്രോഡക്റ്റ് ആഡ് ചെയ്തു!");
                    pendingItemData = null;
                }
                reader.readAsDataURL(file);
            }
        }

        function deleteItem(domainId, index) {
            if (confirm("ഈ പ്രോഡക്റ്റ് ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                const allData = getDomainData();
                allData[domainId].splice(index, 1);
                saveDomainData(allData);
                openDomain(domainId);
            }
        }

        function resetAppSettings() {
            if (confirm("എല്ലാ മാറ്റങ്ങളും റീസെറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = function() {
            const savedBg = localStorage.getItem('appBg');
            if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

            const savedLogo = localStorage.getItem('appLogo');
            if (savedLogo) document.getElementById('appLogoDisplay').innerHTML = `<img src="${savedLogo}" class="w-full h-full object-cover rounded-full">`;

            renderHome();
        }
    </script>
</body>
</html>
