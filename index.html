<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES - One World, Many Opportunities</title>
    <style>
        :root {
            --bg-color: #0c0a06;
            --card-bg: #1a160d;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Login Screen */
        #loginScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .login-box {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            background: #000;
            border: 1px solid var(--gold);
            color: #fff;
            border-radius: 4px;
            text-align: center;
        }

        /* App Container */
        #appContainer {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #332910;
            width: 100%;
            max-width: 1000px;
        }

        .logo-container img {
            width: 80px;
            height: auto;
            border-radius: 10px;
            border: 2px solid var(--gold);
        }

        h1 {
            color: var(--gold);
            margin: 5px 0;
            font-size: 20px;
        }

        p.tagline {
            color: #bfa15f;
            font-size: 11px;
            margin: 0 0 10px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        select, button {
            background: #1a160d;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        button.admin-btn {
            background: var(--gold);
            color: #000;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 1000px;
            padding: 10px 0;
        }

        @media (min-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #4a3b18;
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
        }

        .card:active {
            background: #332910;
        }

        .card img.card-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            margin-bottom: 4px;
            border-radius: 4px;
        }

        .card span.title {
            font-size: 10px;
            font-weight: bold;
            line-height: 1.1;
            color: var(--gold-light);
        }

        .card span.subtitle {
            font-size: 9px;
            color: #bfa15f;
            margin-top: 2px;
        }

        /* Admin Modal */
        #adminModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1a160d;
            border: 2px solid var(--gold);
            padding: 15px;
            border-radius: 8px;
            width: 85%;
            max-width: 350px;
        }
        .modal-content input {
            width: 100%;
            padding: 6px;
            margin: 6px 0;
            background: #000;
            border: 1px solid var(--gold);
            color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 style="color: var(--gold); margin-top:0;">OYES Login</h2>
            <p style="font-size: 12px; color: #bfa15f;">തുടരാൻ നിങ്ങളുടെ ഫോൺ നമ്പറോ ഇമെയിലോ നൽകുക</p>
            <input type="text" id="userInput" placeholder="Phone / Email">
            <button onclick="handleLogin()" style="width:100%; background:var(--gold); color:#000;">Login</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer">
        <header>
            <div class="logo-container">
                <img id="appLogo" src="oyes_logo.png" alt="OYES Logo">
            </div>
            <h1 id="appName">OYES</h1>
            <p class="tagline">ONE WORLD • MANY OPPORTUNITIES</p>
            
            <div class="controls">
                <select id="langSelector" onchange="renderGrid()">
                    <option value="ml">മലയാളം</option>
                    <option value="ta">தமிழ்</option>
                    <option value="hi">हिन्दी</option>
                    <option value="en" selected>English</option>
                    <option value="ar">العربية</option>
                </select>
                <button class="admin-btn" onclick="openAdmin()">⚙️ Admin</button>
            </div>
        </header>

        <!-- 46 Folders Grid -->
        <div class="grid-container" id="folderGrid"></div>

        <!-- Admin Panel Modal -->
        <div id="adminModal">
            <div class="modal-content">
                <h3>Admin Settings</h3>
                <label>Logo Name:</label>
                <input type="text" id="adminLogoInput" value="oyes_logo.png">
                <label>App Title:</label>
                <input type="text" id="adminTitleInput" value="OYES">
                <br><br>
                <button onclick="saveAdminSettings()">Save</button>
                <button style="background:#444; color:#fff;" onclick="closeAdmin()">Cancel</button>
            </div>
        </div>
    </div>
