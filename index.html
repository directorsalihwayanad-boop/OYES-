<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES GLOBAL HUB - Gallery File Uploader Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
            transition: all 0.3s ease;
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.7);
            transform: translateY(-3px);
        }
    </style>
</head>
<body id="appBody" class="flex flex-col justify-between min-h-screen pb-16">

    <!-- Header Section -->
    <header class="p-3 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-40 shadow-2xl">
        <div class="flex justify-between items-center max-w-md mx-auto px-1">
            <div class="flex items-center gap-2 cursor-pointer" onclick="switchBottomTab('home')">
                <div class="w-9 h-9 rounded-full bg-amber-950 border-2 border-amber-500/60 flex items-center justify-center text-xs overflow-hidden shadow-md">
                    <img id="headerLogoImg" src="file_00000000b9608211988d7905e24d9dd0.png" class="w-full h-full object-cover rounded-full" alt="OYES Logo">
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-widest text-amber-400 flex items-center gap-1">
                        OYES HUB <span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded-full border border-amber-500/40">✓ Pro</span>
                    </h1>
                    <p class="text-[8px] text-slate-400">Global Business Portal</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-900 text-amber-300 border border-amber-500/50 text-[10px] rounded-lg px-2 py-1.5 focus:outline-none shadow">
                    <option value="en">English</option>
                    <option value="ml">മലയാളം</option>
                </select>
                <button type="button" onclick="promptAdminLogin()" class="bg-amber-950/90 text-amber-300 text-[10px] font-bold border border-amber-500/60 rounded-lg px-2.5 py-1.5 shadow">⚙️ Admin</button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard View -->
    <main id="homeView" class="flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="card-3d rounded-3xl text-center overflow-hidden border border-amber-500/50 shadow-2xl relative">
            <img id="mainBannerImg" src="file_00000000be808211a0242b24b3b69384.png" class="w-full h-auto object-cover" alt="OYES Banner Tagline">
        </div>

        <div class="relative">
            <input type="text" placeholder="Search anything on OYES..." class="w-full bg-slate-900/90 text-slate-200 text-xs px-4 py-3 pl-10 rounded-2xl border border-slate-800 focus:outline-none focus:border-amber-500 shadow-inner">
            <span class="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
        </div>

        <div id="homeGridContainer" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Sub-Folders View -->
    <div id="subFolderPageView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="switchBottomTab('home')" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Back</button>
            <h3 id="pageTitle" class="text-xs font-bold text-amber-300 text-right">Sub Page</h3>
        </div>
        <div id="pageContentGrid" class="grid grid-cols-2 gap-3 pb-6"></div>
    </div>

    <!-- Multi-Designs Detail View -->
    <div id="designDetailView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="goBackToSubFolders()" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Back</button>
            <h3 id="designPageTitle" class="text-xs font-bold text-amber-300 text-right">Designs</h3>
        </div>
        <div id="designContentGrid" class="grid grid-cols-1 gap-3.5 pb-6"></div>
    </div>

    <!-- Admin Panel & Gallery Uploader View -->
    <div id="adminPageView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4 pb-20">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="switchBottomTab('home')" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Home</button>
            <h3 class="text-xs font-bold text-amber-300">📁 Admin & Gallery Uploader</h3>
        </div>

        <!-- Direct Gallery & File Upload Panel -->
        <div class="card-3d p-4 rounded-2xl space-y-3 border border-amber-500/50">
            <h4 class="text-xs font-bold text-amber-300">🖼️ Upload Logo / Banner from Gallery</h4>
            <p class="text-[10px] text-slate-300">Select an image from your phone gallery or file manager to update instantly.</p>
            
            <div class="space-y-2">
                <label class="block text-[10px] text-amber-400 font-semibold">Choose Target to Update:</label>
                <select id="uploadTargetType" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
                    <option value="logo">App Logo</option>
                    <option value="banner">Home Banner</option>
                    <option value="bg">App Background</option>
                </select>

                <label class="block text-[10px] text-amber-400 font-semibold mt-2">Select Image File (Gallery / File Manager):</label>
                <input type="file" id="galleryFileInput" accept="image/*" class="w-full bg-slate-950 text-xs text-slate-300 px-3 py-2 rounded-xl border border-slate-800 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-slate-950 hover:file:bg-amber-500">
                
                <button type="button" onclick="handleGalleryUpload()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs py-2.5 rounded-xl shadow mt-2">🚀 Upload & Apply Image</button>
            </div>
        </div>

        <!-- Add / Delete Folders Section -->
        <div class="card-3d p-4 rounded-2xl space-y-3 border border-amber-500/50">
            <h4 class="text-xs font-bold text-amber-300">📂 Create / Delete Folders</h4>
            <div class="space-y-2">
                <input type="text" id="newFolderName" placeholder="Folder Name (e.g. Real Estate)" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
                <input type="text" id="newFolderSlogan" placeholder="Folder Subtitle / Slogan" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
                <button type="button" onclick="addNewFolder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 rounded-xl shadow">➕ Create New Folder</button>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-800">
                <h5 class="text-[11px] font-bold text-amber-300 mb-2">Existing Folders List:</h5>
                <div id="adminFoldersList" class="space-y-2 max-h-48 overflow-y-auto pr-1 text-xs"></div>
            </div>
        </div>

        <button type="button" onclick="resetToDefaultData()" class="w-full bg-red-950 border border-red-700 text-red-300 font-bold text-xs py-2.5 rounded-xl shadow">🔄 Reset Everything to Default</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 p-2 z-40 shadow-2xl">
        <div class="flex justify-around items-center max-w-md mx-auto text-center">
            <button onclick="switchBottomTab('home')" id="nav_home" class="flex flex-col items-center text-amber-400 space-y-0.5">
                <span class="text-base">🏠</span>
                <span class="text-[9px] font-bold">Home</span>
            </button>
            <button onclick="switchBottomTab('books')" id="nav_books" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">📖</span>
                <span class="text-[9px]">Books</span>
            </button>
            <button onclick="switchBottomTab('jobs')" id="nav_jobs" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">💼</span>
                <span class="text-[9px]">Jobs</span>
            </button>
            <button onclick="switchBottomTab('cinema')" id="nav_cinema" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">🎬</span>
                <span class="text-[9px]">Cinema</span>
            </button>
            <button onclick="switchBottomTab('entertainment')" id="nav_entertainment" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">👥</span>
                <span class="text-[9px]">Events</span>
            </button>
            <button onclick="switchBottomTab('more')" id="nav_more" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">🗂️</span>
                <span class="text-[9px]">Admin</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Logic with Base64 Gallery Upload Support -->
    <script>
        const defaultRootFolders = [
            { id: 1, name: "WORLD OF KNOWLEDGE", icon: "📖", image: "file_00000000c4c08211b8239d606ec89bbc.png", slogan: "Connecting people • Uniting opportunities", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919947198248" },
            { id: 2, name: "JOB VACANCIES & CLEANING", icon: "💼", image: "file_00000000b3fc8211bf1f6afe9a255554.png", slogan: "Shift in thought • Progress in life", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919947198248" },
            { id: 3, name: "ULTIMATE HOME CONSTRUCTION SOLUTION", icon: "🏠", image: "file_000000009d708211a36cd96f5b948416.png", slogan: "Marble & Granites Collection", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919447276504" },
            { id: 4, name: "STAYS & HOTELS", icon: "🏨", image: "file_0000000079708211b058ca27deb1b8be.png", slogan: "One connection • Endless possibilities", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919947198248" },
            { id: 5, name: "BUY & SELL MARKET HUB", icon: "🤝", image: "file_00000000f5888211ad512e83258ddd20.png", slogan: "Your world • Your community", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919947198248" },
            { id: 6, name: "EVENTS & ADVERTISEMENTS", icon: "🌟", image: "file_000000006c6882118fb5e593feac5e18.png", slogan: "Connect digitally • Move forward together", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919947198248" },
            { id: 7, name: "OYES CINEMA & STUDIO", icon: "🎬", image: "file_00000000de888211994c080cb8cf98e8.png", slogan: "Skills awaken • Possibilities unfold", bg: "file_00000000be808211a0242b24b3b69384.png", waNumber: "919947198248" }
        ];

        const defaultDomainFoldersData = {
            1: [
                {name: "Quran Online", icon: "📖", desc: "Digital Holy Quran reading portal.", link: "https://quran.com", designs: []},
                {name: "Holy Bible", icon: "✝️", desc: "Holy Bible reading portal.", link: "https://www.bible.com", designs: []},
                {name: "Bhagavad Gita", icon: "🕉️", desc: "Bhagavad Gita teachings.", link: "https://www.holy-bhagavad-gita.org", designs: []},
                {name: "Ramayana Epic", icon: "🛕", desc: "Ramayana ancient epic.", link: "https://archive.org", designs: []}
            ],
            2: [
                {name: "Job Vacancies Portal", icon: "📋", desc: "Local & government job updates, Kerala PSC notifications.", link: "https://keralapsc.gov.in", designs: []},
                {name: "House Deep Cleaning Services", icon: "🧹", desc: "Professional deep cleaning services for homes & offices.", link: "", designs: []},
                {name: "Water Tank Cleaning", icon: "🚰", desc: "Sump and overhead water tank cleaning services.", link: "", designs: []}
            ],
            3: [
                {
                    name: "Marble & Granites", icon: "🏛️", desc: "Premium Italian and Indian marbles, black galaxy and tan brown granites.", link: "",
                    designs: [
                        {title: "Design 01 - Statuario Italian Marble", image: "file_000000009d708211a36cd96f5b948416.png", desc: "Premium white imported Italian marble with grey striking veins."},
                        {title: "Design 02 - Botticino Classic Marble", image: "file_000000009d708211a36cd96f5b948416.png", desc: "Beige colored Italian marble ideal for luxury floorings."},
                        {title: "Design 03 - Black Galaxy Granite", image: "file_000000009d708211a36cd96f5b948416.png", desc: "High-grade kitchen countertops and flooring granites."}
                    ]
                }
            ],
            4: [
                {name: "Wayanad Stays", icon: "⛰️", desc: "Resorts and homestays in Wayanad.", link: "https://www.booking.com", designs: []},
                {name: "Kozhikode Hotels", icon: "🌊", desc: "Stays in Kozhikode district.", link: "https://www.booking.com", designs: []},
                {name: "Kochi Stays", icon: "🏙️", desc: "Hotels in Ernakulam / Kochi.", link: "https://www.booking.com", designs: []}
            ],
            5: [
                {name: "Cows & Goats (Live Stock)", icon: "🐄", desc: "Buy and sell pets & farm animals.", link: "", designs: []},
                {name: "Real Estate Hub", icon: "🏡", desc: "Houses, plots and lands for sale.", link: "", designs: []},
                {name: "Vehicles Market", icon: "🚗", desc: "Cars and bikes buy/sell portal.", link: "", designs: []}
            ],
            6: [
                {name: "All Advertisements", icon: "📢", desc: "Digital, print & commercial ads.", link: "", designs: []},
                {name: "Events Management", icon: "🎉", desc: "Hosting, anchoring & event setup.", link: "", designs: []}
            ],
            7: [
                {name: "Pro Studio & Editing", icon: "🎛️", desc: "Free video, audio & VFX editing tools.", link: "https://clipchamp.com", designs: []},
                {name: "Kids Cartoons", icon: "🧸", desc: "Entertainment & cartoons for kids.", link: "https://www.youtube.com", designs: []},
                {name: "Short Films & Cinema Hub", icon: "🎥", desc: "Watch short films, movies and cinema productions.", link: "https://www.youtube.com", designs: []}
            ]
        };

        let rootFolders = JSON.parse(localStorage.getItem('oyes_root_folders')) || defaultRootFolders;
        let domainFoldersData = JSON.parse(localStorage.getItem('oyes_domain_data')) || defaultDomainFoldersData;
        let globalAssets = JSON.parse(localStorage.getItem('oyes_global_assets')) || {
            banner: "file_00000000be808211a0242b24b3b69384.png",
            bg: "file_00000000be808211a0242b24b3b69384.png",
            logo: "file_00000000b9608211988d7905e24d9dd0.png"
        };

        function applyGlobalAssets() {
            document.getElementById('appBody').style.backgroundImage = `url('${globalAssets.bg}')`;
            document.getElementById('mainBannerImg').src = globalAssets.banner;
            document.getElementById('headerLogoImg').src = globalAssets.logo;
        }

        function renderHomeGrid() {
            let container = document.getElementById('homeGridContainer');
            let html = "";
            rootFolders.forEach((folder, idx) => {
                let isFullSpan = (idx === rootFolders.length - 1 && rootFolders.length % 2 !== 0) ? "col-span-2 max-w-[200px] mx-auto w-full" : "";
                let displayFolderIconOrImg = folder.image ? `<img src="${folder.image}" class="w-12 h-12 mx-auto object-cover rounded-full border border-amber-500/50 shadow">` : `<span class="text-3xl block">${folder.icon}</span>`;
                html += `
                    <div onclick="openDomainFolders(${folder.id})" class="card-3d p-3.5 rounded-2xl cursor-pointer flex flex-col justify-between border border-amber-500/40 text-center ${isFullSpan}">
                        <div class="space-y-1.5 mt-1">
                            ${displayFolderIconOrImg}
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${folder.name}</h3>
                            <p class="text-[9px] text-slate-300">${folder.slogan}</p>
                        </div>
                        <div class="flex gap-1.5 mt-3">
                            <span class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-2 py-1.5 rounded-xl flex-1 text-[10px] shadow">Open ➔</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyGlobalAssets();
            renderHomeGrid();
        });

        function switchBottomTab(tab) {
            ['home', 'books', 'jobs', 'cinema', 'entertainment', 'more'].forEach(t => {
                let btn = document.getElementById(`nav_${t}`);
                if(btn) {
                    btn.classList.remove('text-amber-400', 'font-bold');
                    btn.classList.add('text-slate-400');
                }
            });

            let activeBtn = document.getElementById(`nav_${tab}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-amber-400', 'font-bold');
            }

            if(tab === 'home') {
                goBackHome();
            } else if(tab === 'books' && rootFolders[0]) {
                openDomainFolders(rootFolders[0].id);
            } else if(tab === 'jobs' && rootFolders[1]) {
                openDomainFolders(rootFolders[1].id);
            } else if(tab === 'cinema' && rootFolders[6]) {
                openDomainFolders(rootFolders[6].id);
            } else if(tab === 'entertainment' && rootFolders[5]) {
                openDomainFolders(rootFolders[5].id);
            } else if(tab === 'more') {
                promptAdminLogin();
            }
        }

        function promptAdminLogin() {
            let pass = prompt("Enter Admin Passcode (Default: oyes123):");
            if(pass === "oyes123" || pass === "admin") {
                openAdminPanel();
            } else if(pass !== null) {
                alert("Incorrect passcode!");
            }
        }

        function openAdminPanel() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.add('hidden');
            document.getElementById('adminPageView').classList.remove('hidden');
            renderAdminFoldersList();
        }

        function handleGalleryUpload() {
            let fileInput = document.getElementById('galleryFileInput');
            let targetType = document.getElementById('uploadTargetType').value;

            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Image = e.target.result;
                    
                    if(targetType === 'logo') {
                        globalAssets.logo = base64Image;
                    } else if(targetType === 'banner') {
                        globalAssets.banner = base64Image;
                    } else if(targetType === 'bg') {
                        globalAssets.bg = base64Image;
                    }

                    localStorage.setItem('oyes_global_assets', JSON.stringify(globalAssets));
                    applyGlobalAssets();
                    alert("Image successfully uploaded from your gallery and applied!");
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("Please select an image file first!");
            }
        }

        function addNewFolder() {
            let name = document.getElementById('newFolderName').value.trim();
            let slogan = document.getElementById('newFolderSlogan').value.trim();

            if(!name) {
                alert("Please enter folder name!");
                return;
            }

            let newId = Date.now();
            rootFolders.push({ id: newId, name: name, icon: "📁", image: globalAssets.logo, slogan: slogan || "Global opportunity", bg: globalAssets.bg, waNumber: "919947198248" });
            domainFoldersData[newId] = [
                {name: "Sub-Item 1", icon: "📌", desc: "Description here.", link: "", designs: []}
            ];

            localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
            localStorage.setItem('oyes_domain_data', JSON.stringify(domainFoldersData));

            document.getElementById('newFolderName').value = "";
            document.getElementById('newFolderSlogan').value = "";

            renderAdminFoldersList();
            renderHomeGrid();
            alert("New folder created successfully!");
        }

        function deleteFolder(id) {
            if(confirm("Are you sure you want to delete this folder?")) {
                rootFolders = rootFolders.filter(f => f.id !== id);
                delete domainFoldersData[id];

                localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
                localStorage.setItem('oyes_domain_data', JSON.stringify(domainFoldersData));

                renderAdminFoldersList();
                renderHomeGrid();
            }
        }

        function renderAdminFoldersList() {
            let listContainer = document.getElementById('adminFoldersList');
            let html = "";
            rootFolders.forEach(f => {
                html += `
                    <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <span class="text-amber-300 font-semibold truncate max-w-[180px]">${f.name}</span>
                        <button onclick="deleteFolder(${f.id})" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold">Delete</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function resetToDefaultData() {
            if(confirm("Reset all settings and folders to factory default?")) {
                localStorage.clear();
                location.reload();
            }
        }

        let activeDomainContext = null;

        function openDomainFolders(domainId) {
            activeDomainContext = domainId;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('adminPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.remove('hidden');
            
            let rootObj = rootFolders.find(f => f.id == domainId);
            if (rootObj && rootObj.bg) {
                document.getElementById('appBody').style.backgroundImage = `url('${rootObj.bg}')`;
            }

            let grid = document.getElementById('pageContentGrid');
            grid.className = "grid grid-cols-2 gap-3 pb-6";
            let html = "";
            let items = domainFoldersData[domainId] || [];

            document.getElementById('pageTitle').innerText = rootObj ? rootObj.name : ("Folder #" + domainId);

            for (let i = 0; i < items.length; i++) {
                let f = items[i];
                let displayIconOrImg = f.icon ? `<span class="text-3xl block">${f.icon}</span>` : `<span class="text-3xl block">📁</span>`;
                
                html += `
                    <div onclick="openItemDesigns(${domainId}, ${i})" class="card-3d p-3.5 rounded-2xl cursor-pointer flex flex-col justify-between border border-amber-500/50 text-center relative">
                        <div class="space-y-1.5 mt-1">
                            ${displayIconOrImg}
                            <h3 class="font-bold text-[11px] text-amber-300 leading-tight">${f.name}</h3>
                            <p class="text-[10px] text-slate-300">${f.desc}</p>
                        </div>
                        <span class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl block text-[10px] shadow mt-3">View Designs ➔</span>
                    </div>
                `;
            }
            grid.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function openItemDesigns(domainId, itemIdx) {
            document.getElementById('subFolderPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.remove('hidden');

            let item = domainFoldersData[domainId][itemIdx];
            let rootObj = rootFolders.find(f => f.id == domainId);
            let folderWaNumber = rootObj?.waNumber || "919447276504";

            document.getElementById('designPageTitle').innerText = item.name;

            let grid = document.getElementById('designContentGrid');
            let html = "";

            if(item.designs && item.designs.length > 0) {
                item.designs.forEach((des) => {
                    let desImg = des.image ? `<img src="${des.image}" class="w-full h-48 object-cover rounded-xl border border-amber-500/40 shadow mb-3">` : `<div class="w-full h-32 bg-slate-950/70 rounded-xl flex items-center justify-center text-slate-500 text-xs mb-3 border border-slate-800">No Design Photo</div>`;
                    let waLink = `https://wa.me/${folderWaNumber}?text=` + encodeURIComponent(`Inquiry about ${item.name} - ${des.title}`);

                    html += `
                        <div class="card-3d p-4 rounded-2xl space-y-2 border border-amber-500/50">
                            ${desImg}
                            <h4 class="font-bold text-xs text-amber-300">${des.title}</h4>
                            <p class="text-[10px] text-slate-300">${des.desc}</p>
                            <a href="${waLink}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl block text-center text-xs shadow mt-2">💬 Inquire via WhatsApp</a>
                        </div>
                    `;
                });
            } else {
                let waLink = `https://wa.me/${folderWaNumber}?text=` + encodeURIComponent(`Inquiry about ${item.name}`);
                html = `
                    <div class="card-3d p-6 rounded-2xl text-center space-y-3">
                        <p class="text-xs text-slate-300">No specific design photos added yet for this item.</p>
                        <a href="${waLink}" target="_blank" class="bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl block text-xs shadow">Inquire on WhatsApp ➔</a>
                    </div>
                `;
            }

            grid.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function goBackToSubFolders() {
            if(activeDomainContext !== null) {
                openDomainFolders(activeDomainContext);
            } else {
                goBackHome();
            }
        }

        function goBackHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('subFolderPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.add('hidden');
            document.getElementById('adminPageView').classList.add('hidden');
            applyGlobalAssets();
        }
    </script>
</body>
</html>
