<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYES GLOBAL HUB - Complete Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
            background: radial-gradient(circle at top, #0f172a, #020617, #000000);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .card-3d {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.98));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.25);
            transition: all 0.3s ease;
        }
        .card-3d:hover {
            border-color: rgba(245, 158, 11, 0.8);
            transform: translateY(-2px);
        }
        .gold-gradient-text {
            background: linear-gradient(to bottom, #ffeb3b, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body id="appBody" class="flex flex-col justify-between min-h-screen pb-20">

    <!-- Top Header Bar -->
    <header class="p-3 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-40 shadow-2xl">
        <div class="flex justify-between items-center max-w-md mx-auto px-1">
            <button onclick="promptAdminLogin()" class="text-slate-200 text-xl p-1" title="Admin Settings">⚙️</button>
            
            <div class="flex flex-col items-center cursor-pointer" onclick="switchBottomTab('home')">
                <div class="w-10 h-10 rounded-full bg-slate-900 border-2 border-amber-500/80 flex items-center justify-center overflow-hidden shadow-lg -mt-1">
                    <img id="headerLogoImg" src="file_00000000b9608211988d7905e24d9dd0.png" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100'" class="w-full h-full object-cover rounded-full" alt="Logo">
                </div>
                <span class="text-[9px] font-extrabold tracking-widest text-amber-400 mt-0.5">OYES</span>
            </div>
            
            <div class="flex items-center gap-2">
                <select class="bg-slate-900 text-amber-300 border border-amber-500/50 text-[10px] rounded-lg px-2 py-1 focus:outline-none shadow">
                    <option value="en">English</option>
                    <option value="ml">മലയാളം</option>
                </select>
                <button type="button" onclick="promptAdminLogin()" class="bg-amber-950/90 text-amber-300 text-[10px] font-bold border border-amber-500/60 rounded-lg px-2 py-1 shadow">Admin</button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard View -->
    <main id="homeView" class="flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <!-- Hero Banner Section -->
        <div class="card-3d rounded-3xl text-center overflow-hidden border border-amber-500/50 shadow-2xl relative p-4 space-y-1.5">
            <div class="relative z-10 space-y-0.5">
                <h2 class="text-sm font-black tracking-wider gold-gradient-text">CONNECTING PEOPLE</h2>
                <h2 class="text-sm font-black tracking-wider gold-gradient-text">UNITING OPPORTUNITIES</h2>
                <div class="flex items-center justify-center gap-2 pt-1">
                    <span class="h-[1px] w-6 bg-amber-500/50"></span>
                    <p class="text-[8px] tracking-wider text-slate-300 uppercase font-semibold">OYES — A WORLD OF OPPORTUNITIES</p>
                    <span class="h-[1px] w-6 bg-amber-500/50"></span>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative flex items-center">
            <input type="text" placeholder="Search anything on OYES..." class="w-full bg-slate-900/90 text-slate-200 text-xs px-4 py-3 pl-10 pr-10 rounded-2xl border border-slate-800 focus:outline-none focus:border-amber-500 shadow-inner">
            <span class="absolute left-3.5 text-slate-400 text-xs">🔍</span>
            <span class="absolute right-3.5 text-slate-300 text-xs cursor-pointer">🎛️</span>
        </div>

        <!-- Home Grid Folders -->
        <div id="homeGridContainer" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Sub-Folders View -->
    <div id="subFolderPageView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="switchBottomTab('home')" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Back</button>
            <h3 id="pageTitle" class="text-xs font-bold text-amber-300 text-right">Sub Page</h3>
        </div>
        <div id="pageContentGrid" class="grid grid-cols-2 gap-3 pb-6"></div>
    </div>

    <!-- Details View with Email / Inquiry Action -->
    <div id="designDetailView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="goBackToSubFolders()" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Back</button>
            <h3 id="designPageTitle" class="text-xs font-bold text-amber-300 text-right">Details</h3>
        </div>
        <div id="designContentGrid" class="grid grid-cols-1 gap-3.5 pb-6"></div>
    </div>

    <!-- Admin Panel View -->
    <div id="adminPageView" class="hidden flex-grow p-4 max-w-md mx-auto w-full space-y-4 pb-20">
        <div class="flex justify-between items-center bg-slate-900/90 p-3.5 rounded-2xl border border-amber-500/40 shadow-xl">
            <button type="button" onclick="switchBottomTab('home')" class="text-amber-300 text-xs bg-amber-950 border border-amber-700 px-3 py-2 rounded-xl font-semibold">← Home</button>
            <h3 class="text-xs font-bold text-amber-300">⚙️ OYES Admin & Contact Settings</h3>
        </div>

        <!-- Global Contact Info Settings (Email & WhatsApp) -->
        <div class="card-3d p-4 rounded-2xl space-y-2 border border-amber-500/50">
            <h4 class="text-xs font-bold text-amber-300">📧 Admin Email & WhatsApp Settings</h4>
            <label class="block text-[10px] text-slate-400">Official Notification Email:</label>
            <input type="email" id="adminEmailInput" value="Platformoyes@gmail.com" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <label class="block text-[10px] text-slate-400 mt-1">WhatsApp Inquiry Number (with country code):</label>
            <input type="text" id="adminWaInput" value="919947198248" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <button onclick="saveContactSettings()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs shadow mt-2">Save Contact Info</button>
        </div>

        <!-- Update Logo Section -->
        <div class="card-3d p-4 rounded-2xl space-y-2 border border-amber-500/50">
            <h4 class="text-xs font-bold text-amber-300">🖼️ Update Main App Logo</h4>
            <input type="file" id="adminLogoInput" accept="image/*" class="w-full bg-slate-950 text-xs text-slate-300 p-2 rounded-xl border border-slate-800">
            <button onclick="updateAppLogo()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-xs shadow">Save Logo</button>
        </div>

        <!-- Add New Folder Section -->
        <div class="card-3d p-4 rounded-2xl space-y-2 border border-amber-500/50">
            <h4 class="text-xs font-bold text-amber-300">📂 Create New Category / Folder</h4>
            <input type="text" id="newFolderNameInput" placeholder="Folder Name" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <input type="text" id="newFolderSloganInput" placeholder="Folder Slogan / Description" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <label class="block text-[10px] text-amber-400">Card Photo / Icon:</label>
            <input type="file" id="newFolderImgInput" accept="image/*" class="w-full bg-slate-950 text-xs text-slate-300 p-2 rounded-xl border border-slate-800">
            <button onclick="addNewFolder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs shadow">➕ Create Folder</button>
        </div>

        <!-- Add New File/Item Inside Folders Section -->
        <div class="card-3d p-4 rounded-2xl space-y-2 border border-amber-500/50">
            <h4 class="text-xs font-bold text-amber-300">📄 Add New File / Item to Folder</h4>
            <select id="targetFolderSelect" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800"></select>
            <input type="text" id="newItemNameInput" placeholder="Item Name (e.g. Job Vacancy / PDF)" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <input type="text" id="newItemDescInput" placeholder="Short Description" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <input type="text" id="newItemLinkInput" placeholder="External Web Link / PDF URL (Optional)" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <input type="text" id="newItemIconInput" placeholder="Emoji Icon (e.g. 📋, 📄)" value="📌" class="w-full bg-slate-950 text-xs text-slate-200 px-3 py-2 rounded-xl border border-slate-800">
            <button onclick="addNewFileToFolder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs shadow">➕ Add File to Folder</button>
        </div>

        <button onclick="resetFactorySettings()" class="w-full bg-red-950 border border-red-700 text-red-300 font-bold py-2 rounded-xl text-xs shadow">🔄 Reset Everything to Default</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 p-2 z-40 shadow-2xl">
        <div class="flex justify-around items-center max-w-md mx-auto text-center">
            <button onclick="switchBottomTab('home')" id="nav_home" class="flex flex-col items-center text-amber-400 space-y-0.5">
                <span class="text-base">🏠</span>
                <span class="text-[9px] font-bold">Home</span>
            </button>
            <button onclick="switchBottomTab('books')" id="nav_books" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">📖</span>
                <span class="text-[9px]">Books</span>
            </button>
            <button onclick="switchBottomTab('jobs')" id="nav_jobs" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">💼</span>
                <span class="text-[9px]">Jobs</span>
            </button>
            <button onclick="switchBottomTab('cinema')" id="nav_cinema" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">🎬</span>
                <span class="text-[9px]">Cinema</span>
            </button>
            <button onclick="switchBottomTab('entertainment')" id="nav_entertainment" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">👥</span>
                <span class="text-[9px]">Entertainment</span>
            </button>
            <button onclick="switchBottomTab('more')" id="nav_more" class="flex flex-col items-center text-slate-400 hover:text-amber-300 space-y-0.5">
                <span class="text-base">⚙️</span>
                <span class="text-[9px]">Admin</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Master Logic with Email & WhatsApp Integration -->
    <script>
        const defaultRootFolders = [
            { id: 1, name: "WORLD OF KNOWLEDGE", image: "file_00000000c4c08211b8239d606ec89bbc.png", slogan: "Connecting people Uniting opportunities" },
            { id: 2, name: "JOB VACANCIES & CLEANING", image: "file_00000000b3fc8211bf1f6afe9a255554.png", slogan: "Shift in thought Progress in life" },
            { id: 3, name: "ULTIMATE HOME CONSTRUCTION SOLUTION", image: "file_000000009d708211a36cd96f5b948416.png", slogan: "Marbles, Granites, Kota, Vettukallu, Appliances & Workers" },
            { id: 4, name: "STAYS & HOTELS", image: "file_0000000079708211b058ca27deb1b8be.png", slogan: "One connection Endless possibilities" },
            { id: 5, name: "BUY & SELL MARKET HUB", image: "file_00000000f5888211ad512e83258ddd20.png", slogan: "Your world Your community" },
            { id: 6, name: "EVENTS & ADVERTISEMENTS", image: "file_000000006c6882118fb5e593feac5e18.png", slogan: "Connect digitally Move forward together" },
            { id: 7, name: "OYES CINEMA & STUDIO", image: "file_00000000de888211994c080cb8cf98e8.png", slogan: "Watch • Upload • Sell • Earn" }
        ];

        const defaultDomainFoldersData = {
            1: [
                {name: "Quran Online", icon: "📖", desc: "Digital Holy Quran reading and translation portal.", link: "https://quran.com"},
                {name: "Holy Bible", icon: "✝️", desc: "Holy Bible reading portal across multiple versions.", link: "https://www.bible.com"},
                {name: "Bhagavad Gita", icon: "🕉️", desc: "Bhagavad Gita sacred teachings and verses.", link: "https://www.holy-bhagavad-gita.org"},
                {name: "Ramayana Epic", icon: "🛕", desc: "Ramayana ancient epic and spiritual texts.", link: "https://archive.org"},
                {name: "Dhammapada (Buddha Teachings)", icon: "☸️", desc: "The path of Buddha teachings and philosophy.", link: "https://www.accesstoinsight.org"}
            ],
            2: [
                {name: "Job Vacancies Portal", icon: "📋", desc: "Local & government job updates, Kerala PSC notifications.", link: "https://keralapsc.gov.in"},
                {name: "House Deep Cleaning Services", icon: "🧹", desc: "Professional deep cleaning services for homes & offices.", link: ""}
            ],
            3: [
                {name: "Marble & Granites", icon: "🏛️", desc: "Premium Italian and Indian marbles, black galaxy and tan brown granites.", link: ""}
            ],
            4: [
                {name: "Wayanad Stays", icon: "⛰️", desc: "Resorts and homestays in Wayanad.", link: "https://www.booking.com"},
                {name: "Kozhikode Hotels", icon: "🌊", desc: "Stays in Kozhikode district.", link: "https://www.booking.com"}
            ],
            5: [
                {name: "Cows & Goats (Live Stock)", icon: "🐄", desc: "Buy and sell pets & farm animals.", link: ""}
            ],
            6: [
                {name: "All Advertisements", icon: "📢", desc: "Digital, print & commercial ads.", link: ""}
            ],
            7: [
                {name: "Pro Studio & Editing", icon: "🎛️", desc: "Free video, audio & VFX editing tools.", link: "https://clipchamp.com"}
            ]
        };

        let rootFolders = JSON.parse(localStorage.getItem('oyes_root_folders')) || defaultRootFolders;
        let domainFoldersData = JSON.parse(localStorage.getItem('oyes_domain_data')) || defaultDomainFoldersData;
        let appLogo = localStorage.getItem('oyes_app_logo') || "file_00000000b9608211988d7905e24d9dd0.png";
        let adminEmail = localStorage.getItem('oyes_admin_email') || "Platformoyes@gmail.com";
        let adminWa = localStorage.getItem('oyes_admin_wa') || "919947198248";

        function applyAppSettings() {
            document.getElementById('headerLogoImg').src = appLogo;
            document.getElementById('adminEmailInput').value = adminEmail;
            document.getElementById('adminWaInput').value = adminWa;
            renderHomeGrid();
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyAppSettings();
        });

        function renderHomeGrid() {
            let container = document.getElementById('homeGridContainer');
            let html = "";
            rootFolders.forEach((folder, idx) => {
                let isFullSpan = (idx === rootFolders.length - 1 && rootFolders.length % 2 !== 0) ? "col-span-2 max-w-[210px] mx-auto w-full" : "";
                html += `
                    <div class="card-3d p-3 rounded-2xl flex flex-col justify-between border border-amber-500/40 ${isFullSpan}">
                        <div class="flex items-center gap-2.5">
                            <img src="${folder.image}" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100'" class="w-10 h-10 object-cover rounded-xl border border-amber-500/50 shadow flex-shrink-0">
                            <div class="overflow-hidden">
                                <h3 class="font-bold text-[10px] text-amber-300 leading-tight truncate">${folder.name}</h3>
                                <p class="text-[8px] text-slate-300 line-clamp-2 mt-0.5">${folder.slogan}</p>
                            </div>
                        </div>
                        <div class="flex gap-1.5 mt-2.5 pt-2 border-t border-slate-800/60">
                            <button onclick="openDomainFolders(${folder.id})" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-extrabold px-2.5 py-1 rounded-xl flex-1 text-[9px] shadow text-center">Open ➔</button>
                            <button onclick="alert('AI Assistant for ${folder.name}')" class="bg-slate-900 text-emerald-400 border border-emerald-500/40 font-bold px-2 py-1 rounded-xl text-[9px] flex items-center gap-0.5 shadow">🤖 AI</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function switchBottomTab(tab) {
            ['home', 'books', 'jobs', 'cinema', 'entertainment', 'more'].forEach(t => {
                let btn = document.getElementById(`nav_${t}`);
                if(btn) {
                    btn.classList.remove('text-amber-400', 'font-bold');
                    btn.classList.add('text-slate-400');
                }
            });

            let activeBtn = document.getElementById(`nav_${tab}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-amber-400', 'font-bold');
            }

            if(tab === 'home') goBackHome();
            else if(tab === 'books') openDomainFolders(rootFolders[0] ? rootFolders[0].id : 1);
            else if(tab === 'jobs') openDomainFolders(rootFolders[1] ? rootFolders[1].id : 2);
            else if(tab === 'cinema') openDomainFolders(rootFolders[6] ? rootFolders[6].id : 7);
            else if(tab === 'entertainment') openDomainFolders(rootFolders[5] ? rootFolders[5].id : 6);
            else if(tab === 'more') promptAdminLogin();
        }

        function promptAdminLogin() {
            let pass = prompt("Enter Admin Passcode (Default: oyes123):");
            if(pass === "oyes123" || pass === "admin") {
                openAdminPanel();
            } else if(pass !== null) {
                alert("Incorrect Passcode!");
            }
        }

        function openAdminPanel() {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.add('hidden');
            document.getElementById('adminPageView').classList.remove('hidden');
            populateFolderDropdown();
        }

        function saveContactSettings() {
            adminEmail = document.getElementById('adminEmailInput').value.trim() || "Platformoyes@gmail.com";
            adminWa = document.getElementById('adminWaInput').value.trim() || "919947198248";
            localStorage.setItem('oyes_admin_email', adminEmail);
            localStorage.setItem('oyes_admin_wa', adminWa);
            alert("Email & WhatsApp contact settings saved successfully!");
        }

        function populateFolderDropdown() {
            let select = document.getElementById('targetFolderSelect');
            let html = "";
            rootFolders.forEach(f => {
                html += `<option value="${f.id}">${f.name}</option>`;
            });
            select.innerHTML = html;
        }

        function updateAppLogo() {
            let fileInput = document.getElementById('adminLogoInput');
            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    appLogo = e.target.result;
                    localStorage.setItem('oyes_app_logo', appLogo);
                    applyAppSettings();
                    alert("App Logo updated successfully!");
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("Please select an image file first!");
            }
        }

        function addNewFolder() {
            let name = document.getElementById('newFolderNameInput').value.trim();
            let slogan = document.getElementById('newFolderSloganInput').value.trim();
            let fileInput = document.getElementById('newFolderImgInput');

            if(!name) {
                alert("Please enter folder name!");
                return;
            }

            let newId = Date.now();
            let defaultImg = appLogo;

            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    saveNewFolderFinal(newId, name, slogan, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveNewFolderFinal(newId, name, slogan, defaultImg);
            }
        }

        function saveNewFolderFinal(id, name, slogan, image) {
            rootFolders.push({ id: id, name: name, image: image, slogan: slogan || "Global opportunity" });
            domainFoldersData[id] = [];

            localStorage.setItem('oyes_root_folders', JSON.stringify(rootFolders));
            localStorage.setItem('oyes_domain_data', JSON.stringify(domainFoldersData));

            document.getElementById('newFolderNameInput').value = "";
            document.getElementById('newFolderSloganInput').value = "";
            document.getElementById('newFolderImgInput').value = "";

            populateFolderDropdown();
            renderHomeGrid();
            alert("New folder created successfully!");
        }

        function addNewFileToFolder() {
            let targetId = document.getElementById('targetFolderSelect').value;
            let itemName = document.getElementById('newItemNameInput').value.trim();
            let itemDesc = document.getElementById('newItemDescInput').value.trim();
            let itemLink = document.getElementById('newItemLinkInput').value.trim();
            let itemIcon = document.getElementById('newItemIconInput').value.trim() || "📌";

            if(!itemName) {
                alert("Please enter item name!");
                return;
            }

            if(!domainFoldersData[targetId]) {
                domainFoldersData[targetId] = [];
            }

            domainFoldersData[targetId].push({
                name: itemName,
                icon: itemIcon,
                desc: itemDesc || "No description provided.",
                link: itemLink
            });

            localStorage.setItem('oyes_domain_data', JSON.stringify(domainFoldersData));

            document.getElementById('newItemNameInput').value = "";
            document.getElementById('newItemDescInput').value = "";
            document.getElementById('newItemLinkInput').value = "";
            alert("File/Item added successfully to folder!");
        }

        function resetFactorySettings() {
            if(confirm("Reset all settings and folders to default?")) {
                localStorage.clear();
                location.reload();
            }
        }

        let activeDomainContext = null;

        function openDomainFolders(domainId) {
            activeDomainContext = domainId;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('adminPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.add('hidden');
            document.getElementById('subFolderPageView').classList.remove('hidden');
            
            let rootObj = rootFolders.find(f => f.id == domainId);
            let grid = document.getElementById('pageContentGrid');
            let html = "";
            let items = domainFoldersData[domainId] || [];

            document.getElementById('pageTitle').innerText = rootObj ? rootObj.name : ("Folder #" + domainId);

            if(items.length === 0) {
                html = `<div class="col-span-2 text-center py-8 text-xs text-slate-400">No items found in this folder. Add items from Admin Panel.</div>`;
            } else {
                items.forEach((f, i) => {
                    html += `
                        <div onclick="openItemDetails(${domainId}, ${i})" class="card-3d p-3 rounded-2xl cursor-pointer flex flex-col justify-between border border-amber-500/50 text-center">
                            <div class="space-y-1 mt-1">
                                <span class="text-2xl block">${f.icon}</span>
                                <h3 class="font-bold text-[10px] text-amber-300 leading-tight">${f.name}</h3>
                                <p class="text-[9px] text-slate-300 line-clamp-2">${f.desc}</p>
                            </div>
                            <span class="bg-amber-600 text-slate-950 font-bold px-2.5 py-1 rounded-xl block text-[9px] shadow mt-2">Open ➔</span>
                        </div>
                    `;
                });
            }
            grid.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function openItemDetails(domainId, itemIdx) {
            document.getElementById('subFolderPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.remove('hidden');
            let item = domainFoldersData[domainId][itemIdx];
            document.getElementById('designPageTitle').innerText = item.name;
            let grid = document.getElementById('designContentGrid');
            
            let actionBtn = "";
            if(item.link) {
                actionBtn = `<a href="${item.link}" target="_blank" class="bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl block text-xs shadow">Open Link / PDF ➔</a>`;
            } else {
                let waText = encodeURIComponent(`Hello, I am interested in inquiring about: ${item.name} from OYES Global Hub.`);
                let mailSub = encodeURIComponent(`Inquiry regarding ${item.name}`);
                let mailBody = encodeURIComponent(`Hello OYES Team,\n\nI would like to know more details about ${item.name}.\n\nThank you.`);
                
                actionBtn = `
                    <div class="space-y-2">
                        <a href="https://wa.me/${adminWa}?text=${waText}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl block text-xs shadow">💬 Inquire via WhatsApp</a>
                        <a href="mailto:${adminEmail}?subject=${mailSub}&body=${mailBody}" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2.5 rounded-xl block text-xs shadow">✉️ Send Email to ${adminEmail}</a>
                    </div>
                `;
            }

            grid.innerHTML = `<div class="card-3d p-5 rounded-2xl text-center space-y-3"><p class="text-xs text-slate-300">${item.desc}</p>${actionBtn}</div>`;
        }

        function goBackToSubFolders() {
            if(activeDomainContext !== null) openDomainFolders(activeDomainContext);
            else goBackHome();
        }

        function goBackHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('subFolderPageView').classList.add('hidden');
            document.getElementById('designDetailView').classList.add('hidden');
            document.getElementById('adminPageView').classList.add('hidden');
        }
    </script>
</body>
</html>
