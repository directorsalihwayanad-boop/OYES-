name: Build OYES APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract OYES ZIP
        run: |
          set -eu
          mkdir -p project
          ARCHIVE=$(find . -maxdepth 2 -type f -name 'OYES_NEXT_BUILD_46_FOLDERS*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: OYES ZIP file was not found."
            find . -maxdepth 2 -type f
            exit 1
          fi
          echo "Extracting: $ARCHIVE"
          unzip -q "$ARCHIVE" -d project

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "Gradle wrapper found: $GRADLEW"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OYES-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
